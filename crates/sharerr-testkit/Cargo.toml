[package]
name = "sharerr-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Test scaffolding only — never part of a release.
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.151"

# For the `seed-arr` binary only. Same pin as sharerr-store so the workspace
# resolves one libsqlite3-sys.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "tls-none"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
