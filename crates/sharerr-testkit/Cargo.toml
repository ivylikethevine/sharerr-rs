[package]
name = "sharerr-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Synthetic, deterministic fixtures for sharerr's tests. Never part of a release."
# Test scaffolding only — never part of a release.
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
# For the `seed-arr` binary only. The workspace pin is what keeps this in step
# with sharerr-store, so the tree resolves a single libsqlite3-sys.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The shared `mock` module owns the wiremock stubs more than one crate's tests
# were writing by hand; the dependency is fine here because this crate is
# dev-dependency-only by design.
wiremock = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
