[package]
name = "sharerr-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistence for sharerr: the Argon2/ChaCha20-Poly1305 credential vault and the SQLite store."

[lints]
workspace = true

[dependencies]
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
fd-lock = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sharerr-core = { workspace = true }
# `migrate` and `macros` are what provide `sqlx::migrate!`, which embeds
# migrations/ into the binary at compile time; `time` maps the timestamp columns.
sqlx = { workspace = true, features = ["migrate", "macros", "time"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
zeroize = { workspace = true }

[dev-dependencies]
sharerr-testkit = { workspace = true }
tempfile = { workspace = true }
