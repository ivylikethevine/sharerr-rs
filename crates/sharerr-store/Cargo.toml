[package]
name = "sharerr-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sharerr-core = { version = "0.1.0", path = "../sharerr-core" }
# `macros` is what provides `sqlx::migrate!`, which embeds migrations/ into the
# binary at compile time. Unlike `query!` it never reads DATABASE_URL, so builds
# still need no live database.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "tls-none", "migrate", "macros", "time"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
