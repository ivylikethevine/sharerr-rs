[package]
name = "sharerr-torrent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
lava_torrent = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bencode = "0.2.4"
sha1 = "0.11.0"
sharerr-core = { version = "0.1.0", path = "../sharerr-core" }
sharerr-qbit = { version = "0.1.0", path = "../sharerr-qbit" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
secrecy = "0.10.3"
serde_json = "1.0.151"
sharerr-testkit = { path = "../sharerr-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
