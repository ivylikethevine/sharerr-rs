[package]
name = "sharerr-qbit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "qBittorrent WebUI API v2 client, shaped so that adding a share never moves or rewrites the media."

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# Adds to the workspace feature set rather than replacing it: `form` and
# `multipart` are what post the .torrent file.
reqwest = { workspace = true, features = ["form", "multipart"] }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sharerr-client = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
sharerr-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
