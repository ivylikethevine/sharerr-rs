{% extends "layout.html" %}
{% block title %}Sign in to sharerr{% endblock %}

{% block content %}
<h1>Sign in</h1>

{% if let Some(message) = error %}
<p class="error" role="alert">{{ message }}</p>
{% endif %}

<form method="post" action="/login/totp" class="card">
  <label for="code">Code from your authenticator app</label>
  <input id="code" name="code" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code"
         maxlength="7" required autofocus>

  <button type="submit">Sign in</button>
  <p class="hint"><a href="/login">Start over</a></p>
</form>
{% endblock %}
