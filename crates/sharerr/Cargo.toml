[package]
name = "sharerr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Share your media library with friends over the *arr stack you already run."

[lints]
workspace = true

[features]
# Opt-in tier-2 suite that drives the docker compose stack. See docker/README.md.
e2e = []

[dependencies]
anyhow = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie", "form"] }
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek = { workspace = true }
figment = { workspace = true, features = ["toml", "env"] }
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
# For the gluetun control-server client — the one HTTP client the binary owns
# itself rather than through a service crate.
reqwest = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sharerr-arr = { workspace = true }
sharerr-client = { workspace = true }
sharerr-core = { workspace = true }
sharerr-lighthouse = { workspace = true }
sharerr-qbit = { workspace = true }
sharerr-rtorrent = { workspace = true }
sharerr-store = { workspace = true }
sharerr-torrent = { workspace = true }
sharerr-transmission = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["toml", "env", "test"] }
serde_json = { workspace = true }
sharerr-testkit = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
