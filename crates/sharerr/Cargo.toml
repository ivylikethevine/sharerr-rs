[package]
name = "sharerr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Share your media library with friends over the *arr stack you already run."

[lints]
workspace = true

[features]
# Opt-in tier-2 suite that drives the docker compose stack. See docker/README.md.
e2e = []

[dependencies]
anyhow = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie", "form"] }
clap = { workspace = true, features = ["derive", "env"] }
figment = { workspace = true, features = ["toml", "env"] }
getrandom = { workspace = true }
hex = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
sharerr-arr = { workspace = true }
sharerr-core = { workspace = true }
sharerr-qbit = { workspace = true }
sharerr-store = { workspace = true }
sharerr-torrent = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml_edit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
figment = { workspace = true, features = ["toml", "env", "test"] }
serde_json = { workspace = true }
sharerr-testkit = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
