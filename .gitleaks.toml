# gitleaks configuration: the default rules, plus passwords in connection
# strings, which they miss. `gitleaks git` and `gitleaks dir` read it from the
# root of the tree they scan.
#
# An allow list entry pins a path AND the exact value, so a real secret later
# pasted into the same file still fails. Add one only with a comment saying
# what the value is.

[extend]
useDefault = true

[[rules]]
id = "connection-url-password"
description = "Password in a database or broker URL"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb|rediss?|amqps?|sqlserver|mssql)(?:\+[a-z0-9]+)?://[^\s:@/'"]*:([^\s@/'"]{4,})@'''
secretGroup = 1
keywords = ["postgres", "mysql", "mariadb", "mongodb", "redis", "amqp", "sqlserver", "mssql"]

# a variable, a template, an ellipsis or a stand-in, not a password
[[rules.allowlists]]
regexes = ['''^(?:[$<{%*]|\.{3}|(?i:password|passwd|changeme|example|secret|test)$)''']

[[rules]]
id = "connection-keyvalue-password"
description = "Password in a key=value connection string"
regex = '''(?i)\b(?:server|host|data source)\s*=[^"'\n]*?\b(?:password|pwd)\s*=\s*([^;"'\s]{4,})'''
secretGroup = 1
keywords = ["password", "pwd"]

[[rules.allowlists]]
regexes = ['''^(?:[$<{%*]|\.{3}|(?i:password|passwd|changeme|example|secret|test)$)''']

# The tier-2 VPN stack's WireGuard keypair. Both tunnel ends run inside
# docker/compose.vpn.yml and the tunnel goes nowhere, so the keys are test
# fixtures by design (see that file's header).
[[allowlists]]
description = "test-only WireGuard keys for the local VPN test stack"
condition = "AND"
paths = ['''^docker/wireguard/wg0\.conf$''', '''^docker/compose\.vpn\.yml$''']
regexes = [
  '''eL9QUo9BLkTkz2sj5vLykE3tSTAPK/n/xiczYzrSG3U=''',
  '''eIzCt6HUi9Lycm6dtYDUsjJGe7aBlIsDfos\+M4xg2n4=''',
]

# `sharerr preview` renders every page with invented data; this is a made-up
# friend key shown on the preview's reveal dialog.
[[allowlists]]
description = "invented friend key in the preview command's fixture data"
condition = "AND"
paths = ['''^crates/sharerr/src/commands/preview\.rs$''']
regexes = ['''sam-9f2a7c4e1b6d3f80''']
