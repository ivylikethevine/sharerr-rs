## The far end of the test tunnel.
##
## This is a WireGuard *server* configuration, run inside the test stack so that
## gluetun has a real tunnel to establish without a VPN subscription and without
## any route to the internet. The topology is what is being tested, not the tunnel.
##
## The keys below are throwaway, committed on purpose, and reachable only from a
## container network that has no egress. They are exactly as secret as the
## `SHARERR_MASTER_KEY` literal in compose.test.yml — which is to say, not at all,
## deliberately. Never reuse them for anything.

[Interface]
Address = 10.13.13.1/24
ListenPort = 51820
PrivateKey = eL9QUo9BLkTkz2sj5vLykE3tSTAPK/n/xiczYzrSG3U=

## gluetun health-checks its tunnel by reaching something on the far side. Its
## default target is on the internet, which this stack deliberately cannot reach,
## so a listener is parked inside the tunnel for it to find. Without this, gluetun
## decides the tunnel is dead and restarts it every 20 seconds forever.
PostUp = nc -l -k -p 8000 -s 10.13.13.1 &

[Peer]
## gluetun.
PublicKey = mkkHbl2ziJY89iVRpSkVW/dmjydKADsp56WEfyZkaCU=
AllowedIPs = 10.13.13.2/32
