# The same stack, seeding through Deluge instead of qBittorrent.
#
#   ./scripts/run_docker_tests.sh --deluge
#
# Deluge is the fourth torrent client sharerr supports, and the reason it is
# driven for real: `sharerr-deluge`'s unit tests run against a hand-mocked server,
# which proves the crate parses what it expects, not what `deluge-web` sends.
# This stack starts from what the image ships, so it also covers the web UI
# attaching itself to `deluged` and the Label plugin being off.
#
# Everything else — the *arr apps, the fixtures, the deliberately-disagreeing
# mounts — is identical to `compose.test.yml`.
#
# Ports lead with 57, beside the two-instance stack's 58 and 59, so this can run
# alongside the other stacks.

name: sharerr-dl-test

x-puid: &puid "${SHARERR_TEST_UID:-1000}"
x-pgid: &pgid "${SHARERR_TEST_GID:-1000}"

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:386c962ee6e260e3a5656b25df2ed056bcc9b6410e197d075f9547fd14c23bca
    container_name: sharerr-dl-test-sonarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - ./state-dl/sonarr:/config
      - ../tests/fixtures/media/tv:/tv:ro
    ports:
      - "127.0.0.1:57989:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b
    container_name: sharerr-dl-test-radarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - ./state-dl/radarr:/config
      - ../tests/fixtures/media/movies:/movies:ro
    ports:
      - "127.0.0.1:57878:7878"

  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0@sha256:1dbf9663387f85bb5805fcb1418a246f877e01374bb2a6cd9e632c72fb2e1ebc
    container_name: sharerr-dl-test-deluge
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - deluge-config:/config
      # Deluge's view of the same files, at a third path, read-only: a client
      # that tried to move anything would fail here rather than quietly succeed.
      - ../tests/fixtures/media:/downloads:ro
    ports:
      - "127.0.0.1:57112:8112"

  sharerr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sharerr-dl-test-sharerr
    depends_on: [sonarr, radarr, deluge]
    environment:
      SHARERR_MASTER_KEY: test-stack-master-key-not-a-real-secret
      RUST_LOG: sharerr=debug,info
    volumes:
      - ./config-dl:/config
      - sharerr-data:/data
      - ../tests/fixtures/media:/media:ro
    ports:
      - "127.0.0.1:57477:8477"

volumes:
  deluge-config:
  sharerr-data:
