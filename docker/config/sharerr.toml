# Configuration for the compose test stack.
#
# Secrets are deliberately absent: API keys, the qBittorrent password, and the
# Torznab API key live in the encrypted vault, not here. Load them once the stack
# is up — either at http://127.0.0.1:18477/ under Settings, or by piping them in:
#
#   docker compose -f docker/compose.test.yml exec sharerr \
#     sh -c 'printf %s "$SONARR_KEY" | sharerr vault set sonarr.api_key'

data_dir = "/data"
tag = "sharerr"

[server]
bind = "0.0.0.0:8477"

[sonarr]
url = "http://sonarr:8989"

[radarr]
url = "http://radarr:7878"

[lidarr]
url = "http://lidarr:8686"

[qbittorrent]
url = "http://qbittorrent:8080"
category = "sharerr"
tag = "sharerr"
# `true` (the default) trusts qBittorrent to seed newly-added torrents
# immediately rather than re-verifying data sharerr never wrote to.
skip_checking = true

[tracker]
# Whatever friends resolve this instance as. `localhost` only works because every
# peer in this test stack is the same machine. The port is sharerr's own published
# port — the builtin tracker rides the same listener as the web UI and the feed.
advertised_host = "localhost"
port = 18477

[sync]
enabled = false
interval_secs = 900

# The three views of one library, which is the whole reason path mapping exists.
# Sonarr reports /tv, sharerr reads /media/tv, qBittorrent is told /downloads/tv.
[[path_map]]
arr = "/tv"
sharerr = "/media/tv"
qbit = "/downloads/tv"

[[path_map]]
arr = "/movies"
sharerr = "/media/movies"
qbit = "/downloads/movies"

[[path_map]]
arr = "/music"
sharerr = "/media/music"
qbit = "/downloads/music"
