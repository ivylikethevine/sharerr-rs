# sharerr and qBittorrent sharing one VPN exit, via gluetun.
#
#   cd docker/deploy/vpn && cp .env.example .env && $EDITOR .env config/sharerr.toml
#   docker compose up -d
#
# Then the step that is easy to miss — the gluetun API key has to reach sharerr's
# vault, or sharerr never asks gluetun anything. See "Two halves of one key".
#
# Want qBittorrent and sharerr on two separate tunnels instead — two
# subscriptions, two exits, each rotating its address independently? See
# `../dual-vpn/`. No tunnel at all? `../direct/`. Adding sharerr to a stack you
# already run? `../sidecar/`.
#
# ## The topology
#
# gluetun owns the network namespace. qBittorrent and sharerr both join it with
# `network_mode: service:gluetun`, so all three containers share one address, one
# routing table, and one flat port space. Three consequences drive everything
# below, and each one is a thing that silently does not work if you get it wrong:
#
#   * **The containers reach each other on `localhost`, not by name.** sharerr's
#     config says `http://localhost:8080` for qBittorrent. `http://qbittorrent:8080`
#     does not resolve — there is no such network alias, because qBittorrent has no
#     network of its own. (If you have seen a gluetun stack that says `gluetun:8080`,
#     that is the *other* shape: the client in the namespace, everything else
#     outside it. Here sharerr is inside too.)
#   * **`ports:` belongs to gluetun.** Declaring `ports:` on a service that uses
#     `network_mode: service:` is a compose error, not a no-op.
#   * **One port space.** 8080, 8477, 6881 and gluetun's own 8000 control
#     server all have to be distinct, even though they belong to different
#     containers. A collision here looks like a service that starts and then
#     refuses connections.
#
# ## The four ports
#
# Published to the host (the two WebUIs), bound to loopback — put a reverse proxy
# in front of these rather than opening them to the LAN:
#
#   8080  qBittorrent WebUI
#   8477  sharerr WebUI
#
# Reachable from the internet through the tunnel (`FIREWALL_VPN_INPUT_PORTS`):
#
#   6881  qBittorrent's BitTorrent listening port — inbound peer connections
#   8477  sharerr's HTTP port — where friends announce, and the Torznab feed
#         their Prowlarr fetches
#
# 8477 appears in both lists on purpose. It is one listener with two audiences:
# your browser arrives over the published docker port, a friend's indexer arrives
# through the tunnel.
#
# gluetun's control server is the fifth port and is deliberately not in either
# list: `HTTP_CONTROL_SERVER_ADDRESS` binds it to 127.0.0.1, where sharerr can
# reach it because it shares this namespace and nothing else can reach it at all.
#
# ## Two halves of one key
#
# gluetun has made every control-server route private by default since v3.39.1,
# and sharerr will not send a request it knows can only come back 401 — with no
# key configured it skips the poll entirely and logs one warning. So the key has
# to be set in both places or the `[gluetun]` section in config/sharerr.toml does
# nothing at all:
#
#   1. `GLUETUN_API_KEY` in .env, which lands in gluetun via
#      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE below.
#   2. The same value in sharerr's vault, once the stack is up:
#
#        printf %s "$GLUETUN_API_KEY" | \
#          docker compose exec -T sharerr sharerr vault set gluetun.api_key
#
#      or paste it into Settings -> gluetun in the web UI.
#
# Half of it configured looks exactly like all of it configured until you notice
# the announce URLs never changed. Diagnostics shows the poller's last success;
# `docker compose exec sharerr sharerr doctor` names the missing key outright.
#
# ## Read this before assuming the three inbound ports work
#
# Inbound through a commercial VPN needs port forwarding, and almost every
# provider that offers it gives you **one** port, **assigned by them**, often
# changing on reconnect. Three ports of your choosing is not something a typical
# subscription can do, whatever this file asks for.
#
# Two ways out, both real:
#
#   * **Your own WireGuard endpoint** — a VPS, a seedbox, a box at another site.
#     You control its firewall, so all three ports forward and stay put. This is
#     the setup the file is written for and the only one where it works as drawn.
#   * **Provider port forwarding**, in the `VPN_PORT_FORWARDING` block below. You
#     get one port. Give it to qBittorrent's listener, since inbound peers are
#     what actually needs it, and accept that the tracker and the feed are then
#     reachable only if you publish them some other way — a reverse proxy on the
#     host, or a tunnel like Cloudflare/Tailscale that does not depend on the VPN.
#
# `sharerr doctor` will not catch this: a closed inbound port looks identical to a
# quiet swarm from the inside.

name: sharerr-vpn

services:
  # ------------------------------------------------------------------ gluetun
  #
  # The namespace owner. Everything else in this file is a passenger.
  #
  # The image pin, the tunnel credentials, the capabilities, the healthcheck and
  # gluetun's full variable surface live in ../compose.gluetun.reference.yaml. What stays
  # here is what is specific to *this* stack: which ports it publishes, what the
  # firewall lets in, and where the control server listens.
  gluetun:
    extends:
      file: ../compose.gluetun.reference.yaml
      service: gluetun
    container_name: gluetun
    environment:
      # --- what may come in ------------------------------------------------
      #
      # Through the tunnel: the two things friends connect to, plus the peer
      # listener. This is the line that decides whether anyone outside can reach
      # what this instance shares.
      FIREWALL_VPN_INPUT_PORTS: "6881,8477"
      # Through the default interface: the two WebUIs, arriving via the published
      # ports below. Without this the killswitch drops them and both UIs appear
      # dead from the host.
      FIREWALL_INPUT_PORTS: "8080,8477"

      # --- the control server ----------------------------------------------
      #
      # Loopback-only. sharerr is in this namespace so `localhost:8000` reaches
      # it; nothing outside the namespace can, which is why 8000 appears in
      # neither firewall list above and is not published below.
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set this in .env — see "Two halves of one key"}"}'

      # --- provider port forwarding (optional) ------------------------------
      #
      # Uncomment for a provider that supports it. You get one port, chosen by
      # them, on an exit address that also rotates. sharerr's `[gluetun]` config
      # section polls the control server for both values and keeps every
      # torrent's announce URL in step; the up-command makes a reconnect picked
      # up in seconds instead of at the next poll, and the down-command means a
      # port going away is dropped immediately rather than kept as a stale
      # fallback until the next poll finds out on its own.
      #
      # Neither endpoint takes a value — they only *nudge* sharerr to re-ask
      # gluetun, so there is no port to template in. `localhost` is correct
      # because sharerr is in this same namespace.
      #
      # VPN_PORT_FORWARDING: "on"
      # VPN_PORT_FORWARDING_PROVIDER: ${VPN_SERVICE_PROVIDER}
      # VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      # VPN_PORT_FORWARDING_UP_COMMAND: >-
      #   /bin/sh -c 'wget -qO- http://localhost:8477/gluetun/refresh'
      # VPN_PORT_FORWARDING_DOWN_COMMAND: >-
      #   /bin/sh -c 'wget -qO- http://localhost:8477/gluetun/down'
    ports:
      # Both WebUIs. They live here because neither container that serves them
      # has a network of its own — the detail that surprises people.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8477:8477"

  # -------------------------------------------------------------- qbittorrent
  #
  # 5.2 or newer, so sharerr can authenticate with an API key instead of a
  # password — stateless, no session to expire. Generate one under
  # Options -> Web UI -> API key once the stack is up.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
    container_name: qbittorrent
    # No `networks:` and no `ports:`. Both belong to gluetun now.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent-config:/config
      # Read-only on purpose. sharerr never moves, renames, or re-links media,
      # and qBittorrent only ever needs to *read* these files to seed them —
      # so nothing in this stack has a reason to write here.
      - ${MEDIA_PATH:?set this in .env}:/downloads:ro
    restart: unless-stopped

  # ------------------------------------------------------------------ sharerr
  #
  # In the namespace too, which is the point: it announces from the same public
  # address as the swarm traffic, so a friend sees one host rather than two.
  sharerr:
    image: ghcr.io/ivylikethevine/sharerr-rs:latest
    container_name: sharerr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    environment:
      # The one thing that cannot come from the UI, because it encrypts the vault
      # the UI writes into. Generate with `openssl rand -base64 32` and keep it:
      # losing it means losing every stored credential.
      #
      # Nothing else belongs here. Every other setting is a `SHARERR_*` variable
      # that would *pin* its field — figment layers env over the file, so the
      # Settings page renders anything set here disabled, and a save is silently
      # discarded. Configure in config/sharerr.toml or the UI instead.
      SHARERR_MASTER_KEY: ${SHARERR_MASTER_KEY:?set this in .env}
      RUST_LOG: ${RUST_LOG:-sharerr=info,warn}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      # sharerr.toml, rewritten in place by the UI when you save — so this has
      # to be writable by uid 1000, which is what the image runs as.
      - ./config:/config
      # The vault, the database, and the generated .torrent files.
      - sharerr-data:/data
      # The same media, at sharerr's own path. It differs from qBittorrent's
      # /downloads deliberately: the path mappings in sharerr.toml are what
      # translate between the two, and identical mounts would hide a mapping bug
      # here that then bites on a real deployment.
      - ${MEDIA_PATH}:/media:ro
    restart: unless-stopped

volumes:
  # gluetun-config is referenced by the extended service in
  # ../compose.gluetun.reference.yaml. Compose does not import the resources an extended
  # service names, so it has to be declared here.
  gluetun-config:
  qbittorrent-config:
  sharerr-data:
