# The library stack: gluetun, qBittorrent, Sonarr, Radarr.
#
#   docker network create --subnet 172.31.90.0/24 sharerr-shared   # once, before either stack
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d
#
# The sharerr half of this deployment lives in ../sharerr/ and runs as a
# separate `docker compose` project, on its own tunnel. See ../README.md for
# why they are split and how they still reach each other. This file alone is
# also a perfectly ordinary standalone qBittorrent+Sonarr+Radarr-behind-gluetun
# stack if you never bring the other one up.

name: sharerr-media

networks:
  default:
  # The only thing this stack shares with ../sharerr/. Created once, outside
  # compose, so both projects can attach to the same network without either
  # one owning its lifecycle.
  sharerr-shared:
    external: true

services:
  # ------------------------------------------------------------------ gluetun
  #
  # The image pin, the tunnel credentials, the capabilities, the healthcheck and
  # gluetun's full variable surface live in ../../compose.gluetun.reference.yaml. What
  # stays here is what is specific to *this* tunnel.
  gluetun:
    extends:
      file: ../../compose.gluetun.reference.yaml
      service: gluetun
    container_name: media-gluetun
    networks: [default, sharerr-shared]
    environment:
      # Only qBittorrent's listener needs to be reachable from the internet
      # through this tunnel — the tracker/feed live in the other stack now.
      FIREWALL_VPN_INPUT_PORTS: "6881"
      # On the non-tunnel interface: the WebUI, for the host-published port
      # below and for sharerr calling in over sharerr-shared; and the control
      # server, which sharerr polls from the other stack. Both arrive here
      # rather than through the tunnel.
      FIREWALL_INPUT_PORTS: "8080,8000"
      # LAN/docker ranges plus sharerr-shared's own subnet, so a killswitch
      # that is otherwise correctly paranoid does not also block the two
      # cross-stack calls this deployment needs.
      FIREWALL_OUTBOUND_SUBNETS: >-
        ${LAN_SUBNETS:-192.168.0.0/16,172.16.0.0/12,10.0.0.0/8},172.31.90.0/24

      # --- the control server ----------------------------------------------
      #
      # `:8000`, not loopback — unlike the other stacks, the thing that polls
      # this control server is in a different network namespace and arrives over
      # sharerr-shared. That is also why 8000 is in FIREWALL_INPUT_PORTS above.
      #
      # sharerr reads it as `[gluetun_client]` — this tunnel's exit address and
      # forwarded port belong to the torrent client, not to the tracker. The key
      # below therefore goes in the vault as `gluetun_client.api_key`, and it is
      # a *different* key from the one ../sharerr/ uses for its own gluetun:
      #
      #   printf %s "$GLUETUN_API_KEY" | docker compose exec -T sharerr \
      #     sharerr vault set gluetun_client.api_key
      #
      # (run from ../sharerr/, where the sharerr container lives)
      #
      # This control server is reachable by anything else on sharerr-shared, so
      # if that network carries containers you do not fully trust, swap the
      # blanket role below for the per-route one in
      # ../../gluetun-auth.example.toml.
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"${GLUETUN_API_KEY:?set this in .env}"}'

      # --- provider port forwarding (optional) ------------------------------
      #
      # Uncomment for a provider that supports it — private internet access,
      # perfect privacy, privatevpn or protonvpn. gluetun rejects
      # VPN_PORT_FORWARDING for anything else, `custom` included, so this stays
      # off while VPN_SERVICE_PROVIDER is the default.
      #
      # The port this tunnel is granted is qBittorrent's BitTorrent listener.
      # sharerr still wants to know about it — its gossip self-record carries the
      # client's address — so the up/down commands reach *across* to the other
      # stack's sharerr and nudge the `client` poller specifically. Two details
      # make that work: `?target=client` picks the second poller rather than the
      # tracker one, and the hostname is ../sharerr/'s gluetun container, because
      # sharerr rides in its namespace and has no name of its own.
      #
      # sharerr rejects these from non-private source addresses; 172.31.90.0/24
      # qualifies. Neither endpoint takes a value — they only ask sharerr to
      # re-poll, so there is no port to template in.
      #
      # VPN_PORT_FORWARDING: "on"
      # VPN_PORT_FORWARDING_PROVIDER: ${VPN_SERVICE_PROVIDER}
      # VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      # VPN_PORT_FORWARDING_UP_COMMAND: >-
      #   /bin/sh -c 'wget -qO- "http://sharerr-gluetun:8477/gluetun/refresh?target=client"'
      # VPN_PORT_FORWARDING_DOWN_COMMAND: >-
      #   /bin/sh -c 'wget -qO- "http://sharerr-gluetun:8477/gluetun/down?target=client"'
    ports:
      - "127.0.0.1:8080:8080"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:304b19cf94bf4fda534e0b086cab9c5f1a9e139a8180c05c0ad7d2ba1526fa99
    container_name: media-qbittorrent
    # No `networks:` and no `ports:` — both belong to gluetun, which is the
    # only member of this stack that also touches sharerr-shared.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent-config:/config
      - ${MEDIA_PATH:?set this in .env}:/downloads:ro
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19@sha256:c19aa4ecdf03d73e1d5c901da33744cb7eb4d921f89bafed1ca264601d7fa224
    container_name: sonarr
    networks: [default, sharerr-shared]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - sonarr-config:/config
      - ${MEDIA_PATH}/tv:/tv:ro
    ports:
      - "127.0.0.1:8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0@sha256:119aaa4a4f7349bcd2a136c5373a0d7925b5479915c7dfe0c0ad352db2a6d438
    container_name: radarr
    networks: [default, sharerr-shared]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - radarr-config:/config
      - ${MEDIA_PATH}/movies:/movies:ro
    ports:
      - "127.0.0.1:7878:7878"
    restart: unless-stopped

volumes:
  # gluetun-config is referenced by the extended service in
  # ../../compose.gluetun.reference.yaml. Compose does not import the resources an
  # extended service names, so it has to be declared here.
  gluetun-config:
  qbittorrent-config:
  sonarr-config:
  radarr-config:
