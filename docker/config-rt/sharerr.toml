# Configuration for the rTorrent compose test stack.
#
# Identical to docker/config/sharerr.toml except for the choice of client below,
# and rTorrent's exact RPC URL — see the module comment in compose.rtorrent.yml
# for why it is a plain HTTP endpoint despite rTorrent itself speaking nothing
# but SCGI.
#
# Secrets are deliberately absent: they live in the encrypted vault, loaded once
# the stack is up. See docker/README.md.

data_dir = "/data"
tag = "sharerr"

# **The choice that drives everything below.** Without this sharerr would build
# a qBittorrent client, point it at rTorrent's RPC port, and fail confusingly
# rather than on a wrong setting.
torrent_backend = "rtorrent"

[server]
bind = "0.0.0.0:8477"

[sonarr]
url = "http://sonarr:8989"

[radarr]
url = "http://radarr:7878"

[rtorrent]
# The exact RPC URL nginx answers XML-RPC POSTs on inside the container — see
# `sharerr-rtorrent`'s module docs on why this client takes the full URL rather
# than a base to append a well-known path to.
url = "http://rtorrent:8000/RPC2"
# The RPC proxy in this stack has no `.htpasswd` populated, so Basic Auth is
# off entirely and this value is never checked — see compose.rtorrent.yml.
username = "sharerr"
# rTorrent has no categories — only a free-text `d.custom1` slot per download —
# so this one value stands in for qBittorrent's category *and* its tag.
label = "sharerr"

[tracker]
advertised_host = "localhost"
port = 48477

[sync]
enabled = false
interval_secs = 900

# The same deliberately-disagreeing mounts as the plain stack: Sonarr says /tv,
# sharerr reads /media/tv, rTorrent is told /downloads/tv.
[[path_map]]
arr = "/tv"
sharerr = "/media/tv"
qbit = "/downloads/tv"

[[path_map]]
arr = "/movies"
sharerr = "/media/movies"
qbit = "/downloads/movies"
