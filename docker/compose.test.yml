# A disposable *arr stack for exercising sharerr against real services.
#
#   ./scripts/run_docker_tests.sh
#
# This is the tier-2, opt-in stack. The default `cargo test` suite is hermetic and
# needs none of this.
#
# ## Why there is no `internal: true` network
#
# There is none. An internal bridge would enforce the no-egress requirement
# rather than merely stating it, but it also severs the host->container path
# that *published ports* travel, and this stack's entire control plane runs
# over those ports. The host waits on `127.0.0.1:18989/ping`, scrapes API keys
# from a bind mount, runs `seed-arr` against the *arr SQLite databases
# directly, and docker/README.md tells you to open the web UI in a browser.
# Isolating the network breaks all of that: the readiness probes hang for
# their full 180s timeout against containers that are perfectly healthy.
#
# Doing without it costs less than it looks. The reason the tagged content is
# written straight into Sonarr's and Radarr's databases — rather than added
# through their APIs — was never only the network: every fixture title is
# invented, so the metadata lookup against services.sonarr.tv would find
# nothing even with egress. `seed-arr` is therefore still the right approach,
# and nothing in the test path depends on reaching the internet.
#
# What this does mean: the stack does not *prove* sharerr makes no outbound
# requests. That property rests on the code and its hermetic tests.
#
# ## Sonarr, Radarr, and Lidarr keep their config in `./state`, not a named volume
#
# `seed-arr` runs on the host and writes to those SQLite databases directly, which
# needs a path the host can actually open. PUID/PGID default to 1000 and follow the
# invoking user, since the host has to read and write those files too. `down -v`
# does not clear a bind mount, so teardown removes `docker/state` as well.

name: sharerr-test

# Anchored once rather than repeated per service: all *arr-family containers
# must write files the host user can then open.
x-puid: &puid "${SHARERR_TEST_UID:-1000}"
x-pgid: &pgid "${SHARERR_TEST_GID:-1000}"

services:
  sonarr:
    # Pinned rather than :latest — the pre-seeding workaround in README.md couples
    # to Sonarr's database schema, so a silent major bump would be a bad surprise.
    image: lscr.io/linuxserver/sonarr:4.0.19@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    container_name: sharerr-test-sonarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - ./state/sonarr:/config
      # Sonarr's view of the library. Read-only: nothing in this test should ever
      # write to the fixtures, and a bind mount is the cheapest way to prove it.
      - ../tests/fixtures/media/tv:/tv:ro
    ports:
      - "127.0.0.1:18989:8989"

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0@sha256:95ba0801df4d9d1d79d0d9a3849f656542497dab061d91b87ad4f53a71aff3ef
    container_name: sharerr-test-radarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - ./state/radarr:/config
      - ../tests/fixtures/media/movies:/movies:ro
    ports:
      - "127.0.0.1:17878:7878"

  lidarr:
    # Confirmed against this exact version's live schema while building the
    # Lidarr-direct indexer check — a silent major bump is exactly the kind of
    # surprise `seed-arr`'s direct-SQLite writes cannot tolerate.
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40@sha256:c74c32408fdf6e7926ad62641fc1a5544206ee65c33f2188bb179edb30e28f5a
    container_name: sharerr-test-lidarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - ./state/lidarr:/config
      - ../tests/fixtures/media/music:/music:ro
    ports:
      - "127.0.0.1:18686:8686"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
    container_name: sharerr-test-qbittorrent
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
      WEBUI_PORT: "8080"
    volumes:
      - qbit-config:/config
      # qBittorrent's view of the same files, at a *third* path. The three views
      # differing is the normal case, so the test stack reproduces it rather than
      # letting a path-mapping bug hide behind identical mounts.
      - ../tests/fixtures/media:/downloads:ro
    ports:
      - "127.0.0.1:18080:8080"

  # Opt-in. Neither `scripts/run_docker_tests.sh` nor the e2e suite touches Prowlarr — it
  # exists for the manual "add a Generic Torznab indexer" exercise in README.md.
  # Starting it by default cost a fifth container's startup latency and memory on
  # every run for nothing. Bring it up with:
  #
  #   docker compose -f docker/compose.test.yml --profile indexer up -d
  prowlarr:
    profiles: [indexer]
    image: lscr.io/linuxserver/prowlarr:2.5.2@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
    container_name: sharerr-test-prowlarr
    environment:
      PUID: *puid
      PGID: *pgid
      TZ: Etc/UTC
    volumes:
      - prowlarr-config:/config
    ports:
      - "127.0.0.1:19696:9696"

  sharerr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sharerr-test-sharerr
    depends_on: [sonarr, radarr, lidarr, qbittorrent]

    environment:
      # A throwaway key for a throwaway stack. A real deployment supplies this as
      # a docker secret via SHARERR_MASTER_KEY_FILE.
      SHARERR_MASTER_KEY: test-stack-master-key-not-a-real-secret
      RUST_LOG: sharerr=debug,info
    volumes:
      - ./config:/config
      - sharerr-data:/data
      # sharerr's own view of the library — a fourth path, and read-only, because
      # sharerr never needs to write to the media it shares.
      - ../tests/fixtures/media:/media:ro
    ports:
      - "127.0.0.1:18477:8477"

volumes:
  qbit-config:
  prowlarr-config:
  sharerr-data:
