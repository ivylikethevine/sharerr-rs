# Dependency updates.
#
# The workflows pin every action to a commit SHA rather than a tag, and every
# Dockerfile and compose file now pins its base image by digest as well as by
# tag. Both of those make an update an auditable change instead of something
# that happens silently under a moving `@v4` or `:5.2.3`. Pinning is only safe
# with something to move the pins, which is this file: dependabot rewrites the
# SHA *and* the trailing `# vX.Y.Z` comment together, and rewrites a digest
# alongside its tag.
#
# What this file cannot cover, and what covers it instead:
#
#   * Every row of `.github/actions/setup-tool/tools.txt` (zizmor, actionlint,
#     shellcheck, hadolint, trivy, cargo-deny, ...): release assets with no
#     ecosystem here at all.
#   * Inline pins listed in `.github/scripts/check_tool_versions.local.sh`:
#     `CARGO_CHEF_VERSION` in docker/Dockerfile, the `.mcp.json` server, and
#     the just-the-docs `remote_theme` in `_config.yml`.
#   * The MSRV toolchain (ignored below on purpose).
#
#     `tool-versions.yml` watches all three and keeps one tracking issue
#     current, on the same Monday cadence and with the same 7-day cooldown as
#     the `cooldown:` blocks below, so the two never disagree about whether an
#     upstream release counts yet. It also re-checks the SHAs and digests this
#     file does move, so an unmerged bump shows up there as drift.
#   * Whether a base-image bump actually *fixes* anything. Dependabot's docker
#     ecosystem is version-updates-only — GHSA carries no container ecosystem,
#     so there are no alerts to drive a security-update mode — and a digest is
#     just a digest. `image-scan.yml` answers that with trivy by measuring both
#     the pinned digest and what the tag points at now.
#
# The github-actions entry below scans `/.github/actions/*` as well as `/`:
# the composite actions under `.github/actions/` pin their own `uses:` (for
# example actions/cache in setup-tool/action.yml), and without a directory
# entry naming them, those SHAs were pinned but nothing here moved them.
#
# Every compose file in the tree is in scope, which is a constraint on
# filenames. The docker-compose ecosystem matches files by the regex
# `(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml`; the gluetun service fragment is
# named `compose.gluetun.reference.yaml` so it matches — a name like
# `gluetun.reference.yaml`, with no "compose" in it, would never be fetched.
# A new file that holds an image pin has to satisfy that regex, or it goes
# unmanaged in a way nothing here will complain about.
#
# Every ecosystem below feeds one multi-ecosystem group, so a Monday run opens
# (or rebases) a single pull request carrying every update at once, instead of
# one PR per ecosystem and group. Consequences worth knowing:
#
#   * The schedule, commit-message and target-branch live on the group only;
#     GitHub rejects them on an entry assigned to a group, and every entry
#     must name its `patterns` (`["*"]` is "everything").
#   * A semver-major Cargo bump now rides in the same PR as a patch bump rather
#     than getting one of its own. The `ignore:` rules below are what keep the
#     deliberate pins (sqlx's major, the MSRV toolchain) out of it; anything
#     else that breaks CI in the combined PR has to be excluded here or fixed
#     in that PR.
#   * `cooldown:` stays per ecosystem, since it is not a group-level key.
#   * Dependabot *security* updates, if enabled in the repository settings,
#     are not version updates and still open their own PRs.

version: 2

multi-ecosystem-groups:
  all-dependencies:
    # Weekly rather than daily — this is a small project, and tool-versions.yml
    # is timed to land on the same Monday.
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    # Development happens on `dev`; `main` only moves by a release merge.
    # Group-level for every ecosystem below, since entries in a
    # multi-ecosystem group may not set their own.
    target-branch: dev

updates:
  # GitHub Actions. The directory list covers the composite actions under
  # `.github/actions/`; see the header.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    # A week between an action's release and dependabot proposing it here — long
    # enough for a compromised release to be caught and yanked upstream before
    # this repo's own CI ever runs it.
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    # Same reasoning as the github-actions entry above: give a crates.io release
    # a week to be caught if it turns out to be a supply-chain problem.
    cooldown:
      default-days: 7
    ignore:
      # sqlx is pinned deliberately: sharerr-store and sharerr-testkit must resolve
      # a single libsqlite3-sys, and `seed-arr` writes to Sonarr's and Radarr's own
      # database files. A major bump here is a migration, not an update.
      - dependency-name: sqlx
        update-types: ["version-update:semver-major"]

  # CI's Markdown tools (markdownlint-cli2, prettier), pinned with integrity
  # hashes by .github/package-lock.json. ci.yml's `docs` job and
  # scripts/check.sh install them with `npm ci --prefix .github`; the
  # `overrides` block there carries a transitive security floor.
  - package-ecosystem: npm
    directory: /.github
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  # docker/Dockerfile — one file now, building both the sharerr and lighthouse
  # runtime images from a shared builder stage.
  - package-ecosystem: docker
    directory: /docker
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    # Same reasoning as the other entries above.
    cooldown:
      default-days: 7
    ignore:
      # The builder stage is pinned to the workspace MSRV (1.98) on purpose —
      # that pin is what makes `docker build` the MSRV check, and a bump to the
      # latest Rust would quietly delete the only thing in the project that
      # verifies the declared MSRV.
      #
      # Only the three semver update-types are ignored, not the dependency
      # outright. That is the difference digest-pinning makes: a rebuild of
      # `rust:1.98-trixie` still arrives as a digest refresh, so the image
      # keeps picking up Debian's security fixes while the toolchain stays at
      # 1.98. Ignoring `rust` wholesale — as this file did before the pins
      # existed — would freeze the layers too.
      - dependency-name: rust
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # The Terraform providers behind the hosted-lighthouse modules. Nothing in CI
  # applies these, so a bump here is a published recommendation the same way a
  # /docker/deploy pin is.
  - package-ecosystem: terraform
    directories:
      - "/docker/deploy/lighthouse/terraform/aws"
      - "/docker/deploy/lighthouse/terraform/azure"
      - "/docker/deploy/lighthouse/terraform/fly"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  # The compose stacks: the tier-2 test harness under /docker, and the
  # deployment examples under /docker/deploy. The fetcher reads one directory at
  # a time and does not recurse, so every directory holding a compose file has
  # to be named here — the globs below are what keeps that from being a list to
  # maintain by hand.
  #
  # These are pinned by digest for the same reason the Dockerfiles are, but the
  # stakes differ by directory. /docker is what `scripts/run_docker_tests.sh` drives, so
  # a moving tag there means a tier-2 failure that reproduces on nobody else's
  # machine. /docker/deploy is copy-pasted by users, so a bump there is a
  # published recommendation and wants the same review a release does.
  - package-ecosystem: docker-compose
    directories:
      - "/docker"
      # `/docker/deploy/*` matches the directories *under* deploy, not deploy
      # itself, and `compose.gluetun.reference.yaml` sits directly in it — the
      # three tunnelled stacks `extends` that one file for their gluetun pin.
      - "/docker/deploy"
      - "/docker/deploy/*"
      - "/docker/deploy/dual-vpn/*"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
