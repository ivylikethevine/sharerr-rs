# Dependency updates.
#
# The workflows pin every action to a commit SHA rather than a tag, which is what
# makes an update an auditable change instead of something that happens silently
# under a moving `@v4`. That pinning is only safe with something to move the pins,
# which is this file: dependabot rewrites the SHA *and* the trailing `# vX.Y.Z`
# comment together.

version: 2

updates:
  # GitHub Actions. Weekly rather than daily — this is a small project and a PR per
  # action per day would be noise nobody reads.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # A week between an action's release and dependabot proposing it here — long
    # enough for a compromised release to be caught and yanked upstream before
    # this repo's own CI ever runs it.
    cooldown:
      default-days: 7
    groups:
      # The docker/* actions are released together and are used together in one
      # job; separate PRs for each would mean reviewing the same change five times.
      docker:
        patterns:
          - "docker/*"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "docker/*"

  # Cargo. Grouped by semver impact rather than per-crate: a patch bump across
  # thirty transitive crates is one review, while a major bump is a decision and
  # deserves its own PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Same reasoning as the github-actions entry above: give a crates.io release
    # a week to be caught if it turns out to be a supply-chain problem.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # sqlx is pinned deliberately: sharerr-store and sharerr-testkit must resolve
      # a single libsqlite3-sys, and `seed-arr` writes to Sonarr's and Radarr's own
      # database files. A major bump here is a migration, not an update.
      - dependency-name: sqlx
        update-types: ["version-update:semver-major"]

  # The Dockerfile's builder stage is pinned to the workspace MSRV (1.98) on
  # purpose — that pin is what makes `docker build` the MSRV check. Dependabot
  # would otherwise "helpfully" bump it to the latest Rust and quietly delete the
  # only thing in the project that verifies the declared MSRV.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
    # Same reasoning as the other two entries above.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: rust
