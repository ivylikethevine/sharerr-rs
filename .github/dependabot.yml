# Moves the SHA-pinned `uses:` in the workflows and composite actions, the
# Markdown tools' npm lock, Cargo.lock, the digest-pinned images in
# docker/Dockerfile and every compose file, and the Terraform providers, via
# one weekly pull request into dev.
#
# What this file cannot cover, and what covers it instead:
#
#   * The CI tools in .github/actions/setup-tool/tools.txt and the inline pins
#     in .github/scripts/check_tool_versions.local.sh (CARGO_CHEF_VERSION, the
#     .mcp.json server, the just-the-docs theme): tool-versions.yml reports
#     their drift in one tracking issue, on the same Monday and with the same
#     7-day cooldown.
#   * Whether an image bump fixes anything: the docker ecosystems are
#     version-updates-only (GHSA has no container ecosystem), and a digest is
#     just a digest. image-scan.yml measures that with trivy.
#   * The MSRV toolchain: ignored below on purpose.
#
# The docker-compose ecosystem only fetches files matching
# `(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml`, so a new file holding an image
# pin must match it (hence compose.gluetun.reference.yaml) or go unmanaged.
#
# Every ecosystem feeds one multi-ecosystem group, so a Monday run opens (or
# rebases) a single pull request. schedule, commit-message and target-branch
# are group-only keys (GitHub rejects them on an entry in a group); `patterns`
# is required per entry, and cooldown/ignore stay per ecosystem. Dependabot
# security updates, if enabled in the repository settings, still open their
# own pull requests.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    # development happens on dev; main only moves by a release merge
    target-branch: dev

updates:
  # the composite actions under .github/actions/ pin their own `uses:`
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    # let a release age before its bump: a compromised release's window is its
    # first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7

  # .github/package.json -> package-lock.json (markdownlint-cli2, prettier)
  - package-ecosystem: npm
    directory: /.github
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # sharerr-store and sharerr-testkit must resolve a single libsqlite3-sys,
      # and `seed-arr` writes to Sonarr's and Radarr's own databases: a sqlx
      # major is a migration, not an update
      - dependency-name: sqlx
        update-types: ["version-update:semver-major"]

  # docker/Dockerfile, building both the sharerr and lighthouse images
  - package-ecosystem: docker
    directory: /docker
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      # The builder stage is pinned to the MSRV (1.98), which makes
      # `docker build` the MSRV check. Only semver update-types are ignored,
      # so digest refreshes of rust:1.98-trixie still arrive.
      - dependency-name: rust
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # the hosted-lighthouse modules' providers; nothing in CI applies them
  - package-ecosystem: terraform
    directories:
      - "/docker/deploy/lighthouse/terraform/aws"
      - "/docker/deploy/lighthouse/terraform/azure"
      - "/docker/deploy/lighthouse/terraform/fly"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7

  # The tier-2 test stacks under /docker and the deployment examples under
  # /docker/deploy. The fetcher does not recurse, so every directory holding a
  # compose file is named; `/docker/deploy/*` does not match deploy itself,
  # where compose.gluetun.reference.yaml sits.
  - package-ecosystem: docker-compose
    directories:
      - "/docker"
      - "/docker/deploy"
      - "/docker/deploy/*"
      - "/docker/deploy/dual-vpn/*"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
