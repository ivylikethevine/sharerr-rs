name: Feature request
description: A setting, an integration, or a torrent client/*arr app sharerr should talk to
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Two places answer most of these before they are asked:
        [docs/SUPPORT.md](https://github.com/ivylikethevine/sharerr-rs/blob/main/docs/SUPPORT.md)
        carries a verdict and a reason for everything weighed and answered no —
        sources, clients, features tried and removed — and
        [the README's roadmap](https://github.com/ivylikethevine/sharerr-rs/blob/main/README.md#roadmap)
        is what is already planned. A reason that has stopped being true is
        worth raising; so is a case neither considered.

  - type: textarea
    id: what
    attributes:
      label: What you want
      description: The behaviour, not the implementation.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: >-
        The workaround, if there is one — a manual step, a second tool, a cron
        job. Sometimes that turns out to be the answer, and it is always the
        measure of how much this would buy.
    validations:
      required: true

  - type: textarea
    id: integration
    attributes:
      label: If this is a new *arr app or torrent client
      description: >-
        docs/SUPPORT.md has what's already
        weighed. Name the app/client, its API shape (REST, XML-RPC, ...), and
        whether it has the concept sharerr needs from it — categories/tags for
        an *arr app, or a completed/seeding-limits query for a torrent client.
      placeholder: |
        app:        Whisparr
        API:        REST, Sonarr-compatible
        categories: yes, same field name as Sonarr
    validations:
      required: false

  - type: checkboxes
    id: checked
    attributes:
      label: Before you send it
      options:
        - label: I checked docs/SUPPORT.md and the README's roadmap for an existing answer.
          required: true
