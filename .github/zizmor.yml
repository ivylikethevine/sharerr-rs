rules:
  # `aquasecurity/setup-trivy` defaults its `version:` input to `latest`, which
  # zizmor's `unpinned-tools` audit correctly reads as "installs a moving
  # target". That is the point, not an oversight: image-scan.yml's own header
  # comments (both `Install Trivy` steps) explain why — a pinned scanner is a
  # scanner that stops finding anything, unlike hadolint's or actionlint's
  # pins in ci.yml, where findings should only move when the code under test
  # does. The action itself is still SHA-pinned; only the Trivy *version* it
  # installs floats, same tradeoff CLAUDE.md already documents for hadolint
  # and trivy under "Pinned tool versions that dependabot cannot see".
  unpinned-tools:
    ignore:
      - image-scan.yml:89
      - image-scan.yml:140

  # zizmor 1.30.0 added this audit: it wants every workspace-relative
  # `uses: ./.github/...` rewritten to GitHub's July-2026 `$/` self-repository
  # syntax. The rewrite is blocked for now by the other workflow linter this
  # repo pins: actionlint 1.7.12 — the newest release there is — rejects `$/`
  # as an invalid `uses:` format, so applying zizmor's auto-fix turns the
  # actionlint job red instead. Ignored per file rather than fixed until an
  # actionlint release understands the syntax; when one ships, apply
  # `zizmor --fix=safe .github/`, drop this whole block, and bump both pins in
  # ../actions/setup-tool/tools.txt together.
  self-repository:
    ignore:
      - advisories.yml
      - ci.yml
      - coverage.yml
      - docker-image.yml
      - docker-lighthouse.yml
      - docker.yml
      - image-scan.yml
      - link-check.yml
      - pages.yml
      - tool-versions.yml

  # pages.yml's `workflow_run` trigger is the usual dangerous shape in name
  # only: the flagged risk is a privileged run checking out the head SHA of
  # whatever triggered it and building from attacker-controlled content. This
  # one does not. `build`'s checkout carries no `ref:`, so it always builds the
  # default branch; the coverage figure comes from an API query for the newest
  # green coverage.yml run on `main` rather than from the triggering run's own
  # payload; and coverage.yml itself never runs on `pull_request` — so there is
  # no attacker-controlled byte anywhere in the path.
  dangerous-triggers:
    ignore:
      - pages.yml:12
