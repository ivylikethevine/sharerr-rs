# The hermetic tier of the test suite, plus the formatting and lint gates.
#
# Nothing here needs a service container, a database, or the network: the *arr and
# qBittorrent clients are exercised against wiremock on loopback, sqlx runs against
# `sqlite::memory:`, and migrations are embedded at compile time by `sqlx::migrate!`.
# The tier-2 suite that drives docker/compose.test.yml is deliberately excluded —
# see the note on `cargo test` below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, for `audit` only. A new advisory against a dependency is not something
  # a commit to this repo causes, so waiting for the next push to hear about it is
  # waiting for the wrong event.
  schedule:
    - cron: "0 6 * * 1"

# A quick follow-up commit should not leave the previous run burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether anything besides workflow YAML changed. Editing this file (or
  # runner.yml, pages.yml, ...) can't move a Rust lint, a test result, or a
  # shellcheck finding, so there is nothing below for those jobs to re-check —
  # this lets them report "skipped" instead of actually re-running cargo.
  # zizmor and actionlint are deliberately exempt from this gate: they audit
  # .github/ itself, so a workflow-only change is exactly the case they exist
  # to catch.
  #
  # Only push and pull_request get filtered. On schedule (the weekly
  # cargo-deny run) or workflow_dispatch (a human asking for the checks) this
  # job doesn't even run, and the jobs below treat that skip as "assume yes" —
  # a diff against the wrong commit must never be the reason a real check goes
  # quiet.
  # See changes.yml: shared with docker.yml, which wants the identical
  # "anything outside .github/workflows/**" filter.
  changes:
    name: detect changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # changes.yml's own job asks for `pull-requests: read` (dorny/paths-filter
    # lists a PR's files through the API). A reusable workflow's job cannot
    # request a scope the calling job does not hold, so granting it here is
    # what makes the call valid at all — without it GitHub rejects this file
    # outright rather than failing the run.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml
    with:
      filters: |
        code:
          - '**'
          - '!.github/workflows/**'

  # See runner.yml: the one place that decides whether a run gets the
  # self-hosted box, so a fork's pull_request run — which executes the fork's
  # own copy of every *other* job below — can never read vars.RUNNER_LABEL
  # straight off this repo and land its own code there.
  runner:
    name: pick the runner
    uses: ./.github/workflows/runner.yml

  fmt:
    name: rustfmt
    needs: [runner, changes]
    if: needs.runner.result == 'success' && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # rustfmt.toml sets only stable options (edition 2024, max_width,
      # use_field_init_shorthand), so the stable toolchain is sufficient — this
      # does not need nightly rustfmt.
      # Pinned by commit, so `toolchain:` is stated explicitly: this action
      # normally infers the toolchain from the ref name (`@stable`), and a SHA has
      # no name to infer from.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt

      # Its own job rather than a step in `test`: it takes seconds, and a stray
      # blank line should not hide the test results behind a failed job.
      - run: cargo fmt --all --check

  test:
    name: clippy + tests
    needs: [runner, changes]
    if: needs.runner.result == 'success' && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # See the note in the `fmt` job about naming the toolchain explicitly.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      # `cache-on-failure` because this job is *designed* to fail: it is the gate on
      # unwrap_used/expect_used. Without it, every lint failure throws away the
      # compiled dependency tree, so the fix-up push rebuilds all of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # Clippy and the tests share a job because they share target/ and the
      # registry, so splitting them would pay for the dependency build twice.
      #
      # `-D warnings` is what gives the workspace lints teeth: unwrap_used,
      # expect_used and missing_debug_implementations are set to `warn` in
      # Cargo.toml precisely so a gate like this can promote them. If this fails,
      # fix the code — the project's convention is that test modules opt out with
      # an inner `#![allow(clippy::unwrap_used, clippy::expect_used)]`, not that
      # the workspace lint gets weakened.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # --all-features compiles crates/sharerr/tests/e2e.rs so it cannot silently
      # rot, while its #[ignore] keeps it from running.
      #
      # Never add --include-ignored here: those tests shell out to
      # `docker compose -f docker/compose.test.yml` and need a four-container *arr
      # stack plus a generated fixture library. They stay local and opt-in.
      - run: cargo test --workspace --all-features --locked

  # Its own job so an MSRV break fails in about a minute with a name that says what
  # it is, rather than surfacing as a Docker build failure fifteen minutes into the
  # multi-arch matrix. `docker.yml` still catches it — this just catches it first.
  msrv:
    name: msrv (1.98)
    needs: [runner, changes]
    if: needs.runner.result == 'success' && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Pinned to the workspace's declared rust-version. When that changes, this
      # changes with it — they are the same claim in two places.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.98"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: msrv

      # `check`, not `test`: this asks whether the code *compiles* on the declared
      # minimum, which is the whole claim. Running the suite again on an older
      # toolchain would double the cost to re-assert what `test` already proved.
      - run: cargo check --workspace --all-targets --all-features --locked

  audit:
    name: cargo-deny
    needs: [runner, changes]
    if: needs.runner.result == 'success' && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Advisories, licences, and duplicate/banned crates. The tree includes
      # argon2, chacha20poly1305, rustls and an HTTP server; this job is the
      # advisory gate for all of them.
      #
      # Its own job because it is the one check that can start failing without
      # anybody touching the repository — which is also why this workflow has a
      # weekly `schedule:` trigger.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # Neither of these compiles anything, and both guard files that no Rust check
  # looks at. The test stack in particular has already shipped with its `networks:`
  # block commented out and nothing noticed.
  scripts:
    name: shell + compose
    needs: [runner, changes]
    if: needs.runner.result == 'success' && (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Would have caught the secret spliced into a remote `sh -c` string.
      # The .github/ half was added alongside ./setup-tool: a `run:` block
      # inside a composite action is exactly the kind of shell nothing here
      # would otherwise lint, and check_tool_versions.sh/scan_pinned_images.sh
      # were sitting unchecked next to it.
      - run: >
          shellcheck scripts/run_docker_tests.sh scripts/run_docker_tests_two_instance.sh
          scripts/screenshot_pages.sh scripts/run_codeql.sh
          .github/scripts/check_tool_versions.sh .github/scripts/scan_pinned_images.sh
          .github/actions/setup-tool/install.sh .github/actions/setup-tool/lib.sh

      # Schema-validates the compose file without needing the images or a daemon.
      - run: docker compose -f docker/compose.test.yml config -q

      # The same check for the deployment recipes, which are what people
      # actually run. Three of them `extends` the shared gluetun fragment,
      # docker/deploy/compose.gluetun.reference.yaml, so this also catches a
      # fragment edit that breaks its consumers — the failure mode that made a
      # shared fragment worth the indirection.
      #
      # The placeholders exist because every stack guards its required inputs
      # with `${VAR:?}`, which `config` evaluates. Values are shaped like the
      # real thing and are not secrets; the point is to reach the schema check,
      # not to describe a deployment.
      - name: Validate the deployment compose files
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          cat > "$env_file" <<'PLACEHOLDERS'
          WIREGUARD_PRIVATE_KEY=placeholder
          WIREGUARD_ADDRESSES=10.13.13.2/32
          GLUETUN_API_KEY=placeholder
          SHARERR_MASTER_KEY=placeholder
          MEDIA_PATH=/srv/media
          EXTERNAL_NETWORK=media_default
          PLACEHOLDERS
          for f in \
            docker/deploy/direct/compose.yaml \
            docker/deploy/vpn/compose.yaml \
            docker/deploy/sidecar/compose.yaml \
            docker/deploy/dual-vpn/media/compose.yaml \
            docker/deploy/dual-vpn/sharerr/compose.yaml
          do
            echo "::group::$f"
            docker compose -f "$f" --env-file "$env_file" config -q
            echo "::endgroup::"
          done

  # GitHub Actions security audit: expression injection, untrusted checkouts
  # feeding privileged jobs, cache/artifact poisoning — the class of bug that
  # SHA-pinning actions and reading crafted input through env: (see runner.yml)
  # exist to prevent, checked automatically instead of by convention alone.
  #
  # Pinned hosted, not needs.runner: this job installs no apt packages and
  # never touches the Docker socket, so it has nothing to gain from a
  # self-hosted box — and it is exactly the job that should not be the one
  # deciding, by its own runner, whether it trusts that box.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Cached and pinned to a known-good version rather than the newest on
      # every run — zizmor's own findings should change because the workflows
      # changed, not because the linter did. ./setup-tool downloads the pinned
      # release once per version and caches the binary, instead of a
      # `pip install` on every run.
      - uses: ./.github/actions/setup-tool
        with:
          tool: zizmor

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/

  # Bad `needs`, invalid contexts, a step referencing an undefined output — the
  # workflows are code too, and nothing else checks their syntax beyond
  # "does the YAML parse".
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Was `go install` on every run; ./setup-tool caches the pinned release
      # binary instead of resolving and building the module each time.
      - uses: ./.github/actions/setup-tool
        with:
          tool: actionlint

      - name: Lint the workflows
        run: actionlint -color

  # Advisory, not a gate: DL3008 (pin every apt package) and its neighbours are
  # about a Debian mirror's churn, not a defect in this Dockerfile — worth
  # seeing, never worth reddening a PR over. `.hadolint.yaml` documents the
  # handful of rules that do not apply here at all (a reason per entry); what
  # is not in that list still surfaces below.
  #
  # Intentionally the newest hadolint release rather than a pin: unlike a
  # style linter whose findings should only move when the Dockerfile does,
  # hadolint occasionally adds a rule for a genuinely new class of mistake,
  # and this job never blocks a merge regardless of which version notices it.
  hadolint:
    name: hadolint (advisory)
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -sL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - id: lint
        name: Lint the Dockerfiles
        run: |
          set -uo pipefail
          : >"$RUNNER_TEMP/hadolint.out"
          hadolint -c .hadolint.yaml docker/Dockerfile docker/Dockerfile.lighthouse >>"$RUNNER_TEMP/hadolint.out" 2>&1
          status=$?
          if [ -s "$RUNNER_TEMP/hadolint.out" ]; then
            cat "$RUNNER_TEMP/hadolint.out"
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "hadolint: clean across both Dockerfiles"
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi
          exit "$status"
        continue-on-error: true

      - name: Truncate the findings before they go in the summary
        if: steps.lint.outputs.found == '1'
        run: sed -n '1,80p' "$RUNNER_TEMP/hadolint.out" >"$RUNNER_TEMP/hadolint-summary.out"

      - if: steps.lint.outputs.found == '1'
        uses: ./.github/actions/advisory-note
        with:
          title: hadolint
          warning-body: Dockerfile lint findings above - advisory, not blocking
          heading: hadolint found something
          body: >-
            Advisory only: this job never blocks a merge. `.hadolint.yaml` carries a
            reason per silenced rule; anything reaching here is deliberately left visible.
          report-file: ${{ runner.temp }}/hadolint-summary.out

  # Advisory, same reasoning as hadolint above: a heading level or a stray
  # long line in a doc is worth seeing and has never shipped a bug.
  markdownlint:
    name: markdownlint (advisory)
    needs: changes
    if: needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      - id: lint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
          config: ".markdownlint.yaml"

      - if: steps.lint.outcome == 'failure'
        uses: ./.github/actions/advisory-note
        with:
          title: markdownlint
          warning-body: Markdown lint findings above - advisory, not blocking
          heading: markdownlint found something
          body: >-
            Advisory only: this job never blocks a merge. See the step above for the
            findings, or run `markdownlint-cli2 '**/*.md'` locally.

  # Advisory, and deliberately so for now: this is the first run of `typos`
  # against this tree at all, and _typos.toml's own header says why it starts
  # with no entries. Promote this to a gate
  # (same shape as `fmt`/`test`/`msrv` above, no `continue-on-error`) once a
  # run or two has come back clean or the allowlist has caught up with what's
  # left. Not gated on `changes`: a typo can live in Rust source as easily as
  # in a doc, so this runs on every push and PR like workflow-lint does.
  typos:
    name: typos (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: typos

      - id: lint
        name: Check for typos
        continue-on-error: true
        run: typos

      - if: steps.lint.outcome == 'failure'
        uses: ./.github/actions/advisory-note
        with:
          title: typos
          warning-body: Possible typo(s) found above - advisory, not blocking
          heading: typos found something
          body: >-
            Advisory only: this job never blocks a merge. A real misspelling should
            be fixed; a false positive belongs in `_typos.toml` with a comment saying
            what the word is - see that file's own header. Reproduce with `typos`
            locally.
