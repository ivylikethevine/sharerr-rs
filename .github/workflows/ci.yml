# The hermetic tier of the test suite, plus the formatting and lint gates.
#
# Nothing here needs a service container, a database, or the network: the *arr and
# qBittorrent clients are exercised against wiremock on loopback, sqlx runs against
# `sqlite::memory:`, and migrations are embedded at compile time by `sqlx::migrate!`.
# The tier-2 suite that drives docker/compose.test.yml is deliberately excluded —
# see the note on `cargo test` below.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # No weekly `schedule:` here — `audit` used to carry one for exactly the
  # reason a stale-comment-shaped trap warns against: a new advisory against a
  # dependency is not something a commit to this repo causes, so waiting for
  # the next push to hear about it is waiting for the wrong event. But
  # advisories.yml already runs `cargo deny check advisories` weekly, in the
  # shape CLAUDE.md's "Three scheduled workflows" section prescribes for
  # exactly this class of finding — keeping one tracking issue current rather
  # than turning a Monday-morning run red with no diff to point at. Two crons
  # answering the same question, one of them in the wrong shape, was the
  # actual bug; `audit` below now exists purely as the per-PR gate.

# A quick follow-up commit should not leave the previous run burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which runner to use, and whether anything besides workflow YAML changed —
  # merged into one call (see prepare.yml) so every heavy job below waits on one
  # VM boot instead of two. Editing this file (or pages.yml, ...) can't move a
  # Rust lint, a test result, or a shellcheck finding, so there is nothing below
  # for those jobs to re-check on a workflow-only change. zizmor and actionlint
  # are deliberately exempt from this gate: they audit .github/ itself, so a
  # workflow-only change is exactly the case they exist to catch.
  #
  # `prepare` itself decides what a schedule or workflow_dispatch run means (see
  # its own header comment): every job below only ever checks
  # `needs.prepare.outputs.code == 'true'`, with no separate "assume yes on
  # skip" branch to keep in sync.
  # Shared with docker.yml, which wants the identical "anything outside
  # .github/workflows/**" filter.
  prepare:
    name: prepare
    permissions:
      pull-requests: read
    uses: ./.github/workflows/prepare.yml
    with:
      filters: |
        code:
          - '**'
          - '!.github/workflows/**'
          - '!**/*.md'
          - '!docs/screenshots/**'
          # NOT '!docs/**' wholesale: crates/sharerr/src/openapi.rs reads
          # ../../docs/openapi.json in a test, so that one file under docs/ is
          # genuinely code and must still trip this filter.

  fmt:
    name: rustfmt
    needs: prepare
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # rustfmt.toml sets only stable options (edition 2024, max_width,
      # use_field_init_shorthand), so the stable toolchain is sufficient — this
      # does not need nightly rustfmt.
      #
      # A direct `rustup` call, not dtolnay/rust-toolchain: that action force-pushes
      # every branch and tag on each Rust release, so any SHA pin of it goes stale
      # (zizmor's `impostor-commit`) within about six weeks — this repo hit that in
      # practice, not hypothetically. zizmor's own `superfluous-actions` audit
      # recommends this exact replacement. `--profile minimal --no-self-update`
      # matches what the action itself passed to rustup.
      - name: Install the stable toolchain (rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable

      # Its own job rather than a step in `test`: it takes seconds, and a stray
      # blank line should not hide the test results behind a failed job.
      - run: cargo fmt --all --check

  test:
    name: clippy + tests
    needs: prepare
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # See the note in the `fmt` job about installing via rustup directly.
      - name: Install the stable toolchain (clippy)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      # `cache-on-failure` because this job is *designed* to fail: it is the gate on
      # unwrap_used/expect_used. Without it, every lint failure throws away the
      # compiled dependency tree, so the fix-up push rebuilds all of it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # A PR reads main's cache and never writes its own multi-hundred-MB
          # entry — with three rust-cache namespaces plus the buildx `type=gha`
          # cache sharing one 10 GB repo-wide budget, PR traffic writing here
          # would otherwise evict all of them continuously.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy and the tests share a job because they share target/ and the
      # registry, so splitting them would pay for the dependency build twice.
      #
      # `-D warnings` is what gives the workspace lints teeth: unwrap_used,
      # expect_used and missing_debug_implementations are set to `warn` in
      # Cargo.toml precisely so a gate like this can promote them. If this fails,
      # fix the code — the project's convention is that test modules opt out with
      # an inner `#![allow(clippy::unwrap_used, clippy::expect_used)]`, not that
      # the workspace lint gets weakened.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # --all-features compiles crates/sharerr/tests/e2e.rs so it cannot silently
      # rot, while its #[ignore] keeps it from running.
      #
      # Never add --include-ignored here: those tests shell out to
      # `docker compose -f docker/compose.test.yml` and need a four-container *arr
      # stack plus a generated fixture library. They stay local and opt-in.
      - run: cargo test --workspace --all-features --locked

  # Its own job so an MSRV break fails in about a minute with a name that says what
  # it is, rather than surfacing as a Docker build failure fifteen minutes into the
  # multi-arch matrix. `docker.yml` still catches it — this just catches it first.
  #
  # The job name deliberately omits the version. `main`'s ruleset requires this
  # check by its exact name; a name like `msrv (1.98)` would stop matching at
  # the next MSRV bump and block every PR until someone edited the ruleset by
  # hand. The version lives in the install step below instead, where it can
  # change freely.
  msrv:
    name: msrv
    needs: prepare
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Pinned to the workspace's declared rust-version. When that changes, this
      # changes with it — they are the same claim in two places (three, counting
      # docker/Dockerfile's identical FROM pin). See the `fmt` job's note about
      # installing via rustup directly rather than dtolnay/rust-toolchain.
      - name: Install the 1.98 toolchain
        run: |
          rustup toolchain install 1.98 --profile minimal --no-self-update
          rustup default 1.98

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: msrv
          # See the `test` job's identical save-if — same cache-budget reasoning.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `check`, not `test`: this asks whether the code *compiles* on the declared
      # minimum, which is the whole claim. Running the suite again on an older
      # toolchain would double the cost to re-assert what `test` already proved.
      - run: cargo check --workspace --all-targets --all-features --locked

  audit:
    name: cargo-deny
    needs: prepare
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Advisories, licences, and duplicate/banned crates. The tree includes
      # argon2, chacha20poly1305, rustls and an HTTP server; this job is the
      # advisory gate for all of them.
      #
      # Its own job because it is the one check that can start failing without
      # anybody touching the repository — which is also why this workflow has a
      # weekly `schedule:` trigger.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # Neither of these compiles anything, and both guard files that no Rust check
  # looks at. The test stack in particular has already shipped with its `networks:`
  # block commented out and nothing noticed.
  scripts:
    name: shell + compose
    needs: prepare
    if: needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Would have caught the secret spliced into a remote `sh -c` string.
      # The .github/ half was added alongside ./setup-tool: a `run:` block
      # inside a composite action is exactly the kind of shell nothing here
      # would otherwise lint, and check_tool_versions.sh/scan_pinned_images.sh
      # were sitting unchecked next to it.
      - run: >
          shellcheck scripts/run_docker_tests.sh scripts/run_docker_tests_two_instance.sh
          scripts/screenshot_pages.sh scripts/run_codeql.sh
          .github/scripts/check_tool_versions.sh .github/scripts/scan_pinned_images.sh
          .github/actions/setup-tool/install.sh .github/actions/setup-tool/lib.sh

      # Schema-validates the compose file without needing the images or a daemon.
      - run: docker compose -f docker/compose.test.yml config -q

      # The same check for the deployment recipes, which are what people
      # actually run. Three of them `extends` the shared gluetun fragment,
      # docker/deploy/compose.gluetun.reference.yaml, so this also catches a
      # fragment edit that breaks its consumers — the failure mode that made a
      # shared fragment worth the indirection.
      #
      # The placeholders exist because every stack guards its required inputs
      # with `${VAR:?}`, which `config` evaluates. Values are shaped like the
      # real thing and are not secrets; the point is to reach the schema check,
      # not to describe a deployment.
      - name: Validate the deployment compose files
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          cat > "$env_file" <<'PLACEHOLDERS'
          WIREGUARD_PRIVATE_KEY=placeholder
          WIREGUARD_ADDRESSES=10.13.13.2/32
          GLUETUN_API_KEY=placeholder
          SHARERR_MASTER_KEY=placeholder
          MEDIA_PATH=/srv/media
          EXTERNAL_NETWORK=media_default
          PLACEHOLDERS
          for f in \
            docker/deploy/direct/compose.yaml \
            docker/deploy/vpn/compose.yaml \
            docker/deploy/sidecar/compose.yaml \
            docker/deploy/dual-vpn/media/compose.yaml \
            docker/deploy/dual-vpn/sharerr/compose.yaml
          do
            echo "::group::$f"
            docker compose -f "$f" --env-file "$env_file" config -q
            echo "::endgroup::"
          done

  # GitHub Actions security audit plus workflow syntax checking, merged into one
  # job: zizmor catches expression injection, untrusted checkouts feeding
  # privileged jobs, and cache/artifact poisoning; actionlint catches a bad
  # `needs`, an invalid context, a step referencing an undefined output — the
  # workflows are code too, and nothing else checks their syntax beyond "does
  # the YAML parse". Both audit `.github/` itself, so a workflow-only change is
  # exactly the case they exist to catch — neither gates on `prepare`. Both are
  # pinned hosted rather than `needs.prepare.outputs.label`: neither installs
  # apt packages or touches the Docker socket, so neither has anything to gain
  # from the self-hosted box, and this is exactly the job that should not be the
  # one deciding, by its own runner, whether it trusts that box. Both install
  # through ./.github/actions/setup-tool, which caches the pinned release binary
  # instead of a fresh `pip install`/`go install` on every run.
  workflow-lint:
    name: workflow lint (zizmor + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      - uses: ./.github/actions/setup-tool
        with:
          tool: zizmor

      - name: Audit the workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/

      - uses: ./.github/actions/setup-tool
        with:
          tool: actionlint

      - name: Lint the workflows (actionlint)
        run: actionlint -color

  # Three advisory-only checks, merged into one job: none of them ever blocks a
  # merge, and each already ends in its own ./.github/actions/advisory-note
  # call, so the step summary each produces is unchanged — only the VM they
  # share is. hadolint and markdownlint keep their `prepare` gate, now as a
  # step-level `if:` instead of a job-level one; typos stays ungated, same as
  # before — a typo can live in Rust source as easily as in a doc. One
  # consequence of sharing a job: if `prepare` itself fails outright (not
  # merely reports no code changes), this whole job — typos included — is
  # skipped along with it, where standalone `typos` previously ran regardless.
  # `prepare` failing outright is rare enough not to be worth an `if:
  # always()` job condition to preserve that corner exactly.
  advisory:
    name: advisory (hadolint + markdownlint + typos)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Advisory, not a gate: DL3008 (pin every apt package) and its
      # neighbours are about a Debian mirror's churn, not a defect in this
      # Dockerfile — worth seeing, never worth reddening a PR over.
      # `.hadolint.yaml` documents the handful of rules that do not apply here
      # at all (a reason per entry); what is not in that list still surfaces
      # below.
      #
      # Intentionally the newest hadolint release rather than a pin: unlike a
      # style linter whose findings should only move when the Dockerfile does,
      # hadolint occasionally adds a rule for a genuinely new class of
      # mistake, and this step never blocks a merge regardless of which
      # version notices it.
      - name: Install hadolint
        if: needs.prepare.outputs.code == 'true'
        run: |
          set -euo pipefail
          # Floating on `latest` (see the comment above this step for why)
          # means there is no pin to check a checksum against in advance, but
          # the binary and its checksums are still fetched from the same
          # release and verified against each other before anything runs it -
          # a compromised or MITM'd download is rejected rather than silently
          # executed as part of CI.
          tmp="$(mktemp -d)"
          curl -sSfL -o "$tmp/hadolint" \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          curl -sSfL -o "$tmp/checksums.sha256" \
            https://github.com/hadolint/hadolint/releases/latest/download/checksums.sha256
          ( cd "$tmp" && sha256sum -c --ignore-missing <(sed 's/hadolint-linux-x86_64/hadolint/' checksums.sha256) )
          chmod +x "$tmp/hadolint"
          sudo mv "$tmp/hadolint" /usr/local/bin/hadolint
          rm -rf "$tmp"

      - id: hadolint
        name: Lint the Dockerfile
        if: needs.prepare.outputs.code == 'true'
        run: |
          set -uo pipefail
          : >"$RUNNER_TEMP/hadolint.out"
          hadolint -c .hadolint.yaml docker/Dockerfile >>"$RUNNER_TEMP/hadolint.out" 2>&1
          status=$?
          if [ -s "$RUNNER_TEMP/hadolint.out" ]; then
            cat "$RUNNER_TEMP/hadolint.out"
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "hadolint: clean"
            echo "found=0" >>"$GITHUB_OUTPUT"
          fi
          exit "$status"
        continue-on-error: true

      - name: Truncate the hadolint findings before they go in the summary
        if: needs.prepare.outputs.code == 'true' && steps.hadolint.outputs.found == '1'
        run: sed -n '1,80p' "$RUNNER_TEMP/hadolint.out" >"$RUNNER_TEMP/hadolint-summary.out"

      - if: needs.prepare.outputs.code == 'true' && steps.hadolint.outputs.found == '1'
        uses: ./.github/actions/advisory-note
        with:
          title: hadolint
          warning-body: Dockerfile lint findings above - advisory, not blocking
          heading: hadolint found something
          body: >-
            Advisory only: this job never blocks a merge. `.hadolint.yaml` carries a
            reason per silenced rule; anything reaching here is deliberately left visible.
          report-file: ${{ runner.temp }}/hadolint-summary.out

      # Advisory, same reasoning as hadolint above: a heading level or a
      # stray long line in a doc is worth seeing and has never shipped a bug.
      - id: markdownlint
        if: needs.prepare.outputs.code == 'true'
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
          config: ".markdownlint.yaml"

      - if: needs.prepare.outputs.code == 'true' && steps.markdownlint.outcome == 'failure'
        uses: ./.github/actions/advisory-note
        with:
          title: markdownlint
          warning-body: Markdown lint findings above - advisory, not blocking
          heading: markdownlint found something
          body: >-
            Advisory only: this job never blocks a merge. See the step above for the
            findings, or run `markdownlint-cli2 '**/*.md'` locally.

      # Advisory, and deliberately so for now: this is the first run of
      # `typos` against this tree at all, and _typos.toml's own header says
      # why it starts with no entries. Promote this to a gate (same shape as
      # `fmt`/`test`/`msrv` above, no `continue-on-error`) once a run or two
      # has come back clean or the allowlist has caught up with what's left.
      - uses: ./.github/actions/setup-tool
        with:
          tool: typos

      - id: typos
        name: Check for typos
        continue-on-error: true
        run: typos

      - if: steps.typos.outcome == 'failure'
        uses: ./.github/actions/advisory-note
        with:
          title: typos
          warning-body: Possible typo(s) found above - advisory, not blocking
          heading: typos found something
          body: >-
            Advisory only: this job never blocks a merge. A real misspelling should
            be fixed; a false positive belongs in `_typos.toml` with a comment saying
            what the word is - see that file's own header. Reproduce with `typos`
            locally.
