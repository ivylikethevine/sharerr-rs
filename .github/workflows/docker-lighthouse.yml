# Builds `docker/Dockerfile`'s `runtime-lighthouse` target and publishes it to
# GHCR. Everything about how that happens lives in docker-image.yml, shared
# with docker.yml — see that file for the reasoning. Only what is specific to
# the lighthouse is here.
#
# Deliberately its own workflow rather than a second `uses:` job sharing
# docker.yml's file. The lighthouse is a separate product: a standalone
# rendezvous service meant to be self-hosted by anyone, on neutral ground away
# from any particular library (see docs/LIGHTHOUSE.md). It gets its own image,
# its own tag series and its own approval, so publishing a sharerr release is
# not also, silently, publishing a lighthouse — and so a break in one build
# cannot hold the other's release.

name: Docker (lighthouse)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-lighthouse-${{ github.ref }}
  cancel-in-progress: true

# See docker.yml's identical block: the `docker` job below already declares
# its own `permissions:`, which fully replaces this default rather than being
# intersected with it, so this has no effect on that job today. It exists for
# a future job with no block of its own, and because Scorecard's
# Token-Permissions check looks for a top-level declaration specifically.
permissions:
  contents: read

jobs:
  # Named after the image, not a bare `docker`: this and docker.yml both
  # call docker-image.yml, and their `build` checks would otherwise both report
  # as `docker / build` — one name two checks share cannot be required by
  # `main`'s ruleset unambiguously.
  docker:
    name: docker (lighthouse)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/docker-image.yml
    with:
      # A second package in the owner's namespace rather than a suffix on this
      # repo's — `sharerr-lighthouse` is the crate's name and the binary's
      # name, and an operator looking for it should find it under that name.
      image: ghcr.io/${{ github.repository_owner }}/sharerr-lighthouse
      target: runtime-lighthouse
      cache-scope: lighthouse
      publish-concurrency-group: release-lighthouse
      # Half of docker.yml's: this image builds one crate with no *arr
      # clients, no torrent clients and no sqlx, and its runtime stage
      # installs the same two packages.
      build-timeout: 15
      # docker.yml's image is named for the repository itself, so
      # docker/metadata-action's default OCI labels already link the GHCR
      # package back to it. This image is named for the crate instead, so the
      # link back to the repo has to be stated.
      extra-labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.title=sharerr-lighthouse
        org.opencontainers.image.description=The lighthouse — a standalone key-hash to endpoint rendezvous service for sharerr
      # Narrower than docker.yml's equivalent: this image is built from one
      # crate that depends on nothing else in the workspace, so a change
      # confined to, say, crates/sharerr-qbit cannot alter what this workflow
      # would produce. The lockfile and the root manifest are in the list
      # because the build is `--locked` and resolves against both. Tag pushes
      # bypass this filter entirely (docker-image.yml's own `build` job `if:`).
      filters: |
        code:
          - 'crates/sharerr-lighthouse/**'
          - 'docker/Dockerfile'
          - 'Cargo.toml'
          - 'Cargo.lock'
