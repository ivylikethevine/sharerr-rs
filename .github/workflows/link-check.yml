# Checks every external URL in the repo's markdown — and in the web UI's
# documentation-link table, `web::docs` — for dead links.
#
# A rotted URL in the docs is worth seeing and has never shipped a bug, so
# this reports and never blocks — same reasoning as hadolint and markdownlint
# in ci.yml. Weekly rather than on every push: a link a PR didn't touch does
# not go stale because of that PR, so checking it on every commit would just
# be the same round trip repeated for no new information.
name: Link check

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: check links (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version-pinned, unlike Trivy in image-scan.yml: a link checker that
      # changes its own crawling rules mid-week would fail a PR that changed
      # no links, where a stale vulnerability scanner just stops finding
      # things - the two advisory checks want opposite freshness. ./setup-tool
      # downloads the pin as a release binary once per version and caches it,
      # instead of a fresh `cargo install --version 0.24.2 --locked` source
      # build every run.
      - uses: ./.github/actions/setup-tool
        with:
          tool: lychee

      # 200/204/206 are ordinary success; 429 is a server saying "you are
      # checking too fast", not "the link is dead" — treating it as a failure
      # would make this job flaky against sites that rate-limit HEAD requests
      # rather than honest about broken links.
      - id: check
        name: Check for dead links
        continue-on-error: true
        run: |
          set -uo pipefail
          lychee --accept 200,204,206,429 \
            --format markdown --output "$RUNNER_TEMP/lychee.md" \
            '**/*.md' crates/sharerr/src/web/docs.rs
          status=$?
          echo "found=$([ "$status" -ne 0 ] && echo 1 || echo 0)" >>"$GITHUB_OUTPUT"
          exit "$status"

      - if: steps.check.outputs.found == '1'
        uses: ./.github/actions/advisory-note
        with:
          title: lychee
          warning-body: Broken link(s) found in the docs - advisory, not blocking
          heading: lychee found a broken link
          body: >-
            Advisory only: this job never blocks a merge. Reproduce with
            `lychee '**/*.md' crates/sharerr/src/web/docs.rs`.
          report-file: ${{ runner.temp }}/lychee.md
