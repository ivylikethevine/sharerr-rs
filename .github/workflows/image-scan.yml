# Two trivy scans that answer different questions, kept in one file because
# they share a schedule and a subject.
#
# `trivy` scans the image this repo *publishes* — `ghcr.io/<repo>:latest` — for
# fixable HIGH/CRITICAL vulnerabilities in whatever ended up in the runtime
# layer: the pinned ca-certificates/curl from `apt-get`, plus whatever the Rust
# binary itself statically links. It asks "has what we shipped gone stale".
#
# `pins` scans the images this repo *builds on* — every `FROM` and `image:`
# digest pin across the Dockerfiles and the compose stacks. It asks "is there a
# better base to build the next one from", and it only speaks when the answer
# is yes: it scans the pinned digest, scans what the tag points at now, and
# reports only when the second is verifiably better than the first. The state
# machine and the reasoning live in .github/scripts/scan_pinned_images.sh's
# header; the short version is that dependabot bumps on release, not on
# severity, and nothing else here would say "the digest you are pinned to now
# has a fixable hole".
#
# Both are advisory. A CVE landing upstream is not a reason to redden somebody's
# unrelated PR, so this runs on its own schedule and never blocks a merge —
# `docker.yml`'s manual-approval gate is what stops a genuinely bad image from
# reaching `:latest` in the first place; this is what tells you a *previous*
# one has gone stale.
#
# They differ in how they speak, and deliberately. `trivy` writes a ::warning
# and a step summary: its subject is one image that a rebuild fixes, and the
# rebuild is a decision somebody makes while looking at the release anyway.
# `pins` keeps a tracking issue current, because a repin that would close a CVE
# is a standing state nobody is otherwise looking at, and an annotation in a
# scheduled run that goes unopened is not a notification.

name: Image scan

on:
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  trivy:
    name: scan published image (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A fresh checkout of this repo, before any `v*` tag has ever been
      # pushed, has nothing at `:latest` — that is a state worth a quiet
      # notice, not a red workflow run every Wednesday until the first release.
      - id: probe
        name: Check whether an image has been published yet
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail
          if docker manifest inspect "${IMAGE}:latest" >/dev/null 2>&1; then
            echo "exists=1" >>"$GITHUB_OUTPUT"
          else
            echo "exists=0" >>"$GITHUB_OUTPUT"
            echo "::notice title=image-scan::${IMAGE}:latest has not been published yet - nothing to scan"
          fi

      # Intentionally the newest Trivy and the newest vulnerability database
      # rather than a pin: a stale scanner is a scanner that stops finding
      # anything, which is the one failure mode a vulnerability scan cannot
      # afford — unlike hadolint's or actionlint's pinned versions, where the
      # findings should only move when the code under test does. `version:
      # latest` (the action's default) keeps that; only the mechanism moved,
      # from an unpinned `curl | sh` off trivy's `main` branch to a SHA-pinned
      # action, itself pinned to a specific install-script commit rather than
      # a moving branch ref.
      - if: steps.probe.outputs.exists == '1'
        name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - if: steps.probe.outputs.exists == '1'
        id: scan
        name: Scan for fixable HIGH/CRITICAL vulnerabilities
        continue-on-error: true
        run: |
          set -uo pipefail
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table \
            --exit-code 1 "${IMAGE}:latest" | tee "$RUNNER_TEMP/trivy.out"
          status=$?
          echo "found=$([ "$status" -eq 1 ] && echo 1 || echo 0)" >>"$GITHUB_OUTPUT"
          exit "$status"

      - if: steps.probe.outputs.exists == '1' && steps.scan.outputs.found == '1'
        uses: ./.github/actions/advisory-note
        with:
          title: trivy
          warning-body: Fixable HIGH/CRITICAL vulnerabilities in ${{ env.IMAGE }}:latest - advisory, not blocking
          heading: Trivy found fixable HIGH/CRITICAL vulnerabilities
          body: >-
            In `${{ env.IMAGE }}:latest` — see the step above for the full report.
            Rebuilding and re-tagging `:latest` (no code change required) picks up
            patched base-image packages; this job never blocks a merge either way.

      - if: steps.probe.outputs.exists == '1' && steps.scan.outputs.found == '0'
        name: Say so
        run: |
          echo "trivy: no fixable HIGH/CRITICAL vulnerabilities in ${IMAGE}:latest"

  pins:
    name: scan the pinned base images (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # Intentionally the newest Trivy and the newest vulnerability database
      # rather than a pin, for the reason the `trivy` job above gives: a stale
      # scanner is a scanner that stops finding anything. See that job's
      # install step for why this is now a SHA-pinned action rather than
      # `curl | sh` off a moving branch.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      # The three advisory verdicts (0 clean, 1 a finding with no better image
      # to move to, 2 a repin that demonstrably helps) are all green here.
      # Captured as an output rather than left to continue-on-error, which
      # collapses them all to "failure" and would lose the distinction the next
      # step is built on; anything else really is a broken job (127 is a missing
      # trivy or jq, or an empty checkout) and still fails loudly.
      - id: scan
        name: Compare each pinned digest against its current tag
        env:
          SHARERR_SCAN_REPORT: ${{ runner.temp }}/image-scan-report.md
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/scan_pinned_images.sh || rc=$?
          echo "verdict=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -le 2 ] || exit "$rc"

      # The report is the summary and the issue body both, so the two can never
      # drift into saying different things. The trailer is appended
      # unconditionally too — harmless on the clean path, since nothing reads
      # the file there — rather than duplicating the verdict check here as
      # well as in the `actionable` input two steps down.
      - name: Say what it found
        env:
          REPORT: ${{ runner.temp }}/image-scan-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat "$REPORT" >>"$GITHUB_STEP_SUMMARY"
          # the backticks are a markdown code span, not a substitution
          # shellcheck disable=SC2016
          printf '\nFound by [`image-scan`](%s). Closed automatically once the pins no longer need it.\n' \
            "$RUN_URL" >>"$REPORT"

      # See .github/actions/upsert-tracking-issue for the shape this,
      # advisories.yml, and tool-versions.yml all share.
      - name: Keep the tracking issue current
        uses: ./.github/actions/upsert-tracking-issue
        with:
          label: image-scan
          label-color: D93F0B
          label-description: A pinned base image can be repinned to fix a CVE
          title: Base image repin would close known vulnerabilities
          resolved: ${{ steps.scan.outputs.verdict != '2' }}
          close-comment: >-
            The pins no longer have a fixable finding a repin would clear.
            [Latest run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          body-file: ${{ runner.temp }}/image-scan-report.md

      - if: steps.scan.outputs.verdict == '2'
        run: echo "::warning title=trivy::A pinned base image can be repinned to close known vulnerabilities - see the issue"
