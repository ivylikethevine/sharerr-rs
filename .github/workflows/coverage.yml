# Line/region coverage over the hermetic (tier 1) test suite, via
# cargo-llvm-cov. Two paths:
#
#   * after every green CI run on `main` (and on dispatch): measure, publish
#     the badge figures as an artifact for pages.yml, and fail below the
#     floor in scripts/check.sh (COVERAGE_FLOOR_LINES)
#   * on a same-repo pull request: measure the PR and keep one comment on it
#     current, comparing with `main`'s latest figure. Advisory; never blocks.
#
# Tier 1 only, deliberately: this runs the same suite ci.yml's `test` job
# does, not `--include-ignored`. The tier 2 suite drives a real Docker Compose
# stack (see docs/TESTING.md) — coverage over a suite this workflow cannot run
# would just be a misleading percentage.
#
# The `main` leg chains off a green CI run rather than `push: branches: [main]`
# directly: only a tree `cargo test` already passed on is worth a full
# instrumented rebuild. See pages.yml's header for why a workflow_run trigger
# is safe despite zizmor's default suspicion of it: no job on that leg checks
# out the triggering run's ref.
#
# The pull_request leg runs PR code with a read-only token; the one job that
# can write (the comment) checks nothing out and only reads that run's own
# artifact. A fork PR's token cannot write to the PR at all, so forks skip
# both jobs rather than measure a figure nobody would see.
name: Coverage

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Drafts skip, same as ci.yml; `converted_to_draft` is not listed because
  # there is no PR-side comment to withdraw.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Per PR, a follow-up push supersedes the previous measurement. On `main`, two
# merges in quick succession would otherwise run two full instrumented builds
# back to back, each triggering its own pages.yml deploy — the later one is
# what should ship, so cancelling (or displacing a pending run) loses nothing.
# Nothing here upserts an issue, so there is no list-then-create race to
# serialise.
concurrency:
  group: coverage-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo-llvm-cov (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # only a green push to main gets a fresh run; a manual dispatch passes
    # the first clause
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain (llvm-tools-preview)
        uses: $/.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Instrumented and ordinary builds produce different target/ trees;
          # sharing a key with ci.yml's `test` job would thrash both caches.
          key: coverage
          # See ci.yml's `test` job for the cache-budget reasoning.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The tools.txt pin, a cached release binary rather than a
      # `cargo install` source build every run.
      - uses: $/.github/actions/setup-tool
        with:
          tool: cargo-llvm-cov

      # Collects profile data once; the steps below read it without re-running
      # the suite. Teed to a log so the test-count step can sum it without a
      # second, uninstrumented compile of the same suite.
      - name: Run the hermetic suite under instrumentation
        run: |
          set -euo pipefail
          scripts/check.sh coverage-run 2>&1 | tee test-run.log

      - name: Render the HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      # Kept in a file for the badge step below, rather than rendered twice.
      - name: Summarize
        run: |
          set -euo pipefail
          cargo llvm-cov report --summary-only >"$RUNNER_TEMP/coverage-summary.txt"
          {
            echo "### Coverage (tier 1 suite only)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/coverage-summary.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # What the README badge reads: a shields.io "endpoint" badge
      # (https://img.shields.io/endpoint) pointing at pages.yml's published
      # copy of this file's content, rather than a Codecov upload — no
      # third-party account, no token to provision. It travels there as a
      # build artifact rather than a commit: `main` carries a ruleset that no
      # Actions `git push` can satisfy, so pages.yml fetches the freshest copy
      # of this artifact and writes it into the site it already deploys.
      #
      # The Lines column specifically, not Regions: `cargo-llvm-cov
      # report --summary-only`'s TOTAL row has "N / Missed / Cover%" triples in
      # a fixed order (Regions, Functions, Lines), so the *first* percentage on
      # the line is Regions coverage — field 10 is Lines, not field 4.
      - name: Compute the badge endpoint
        run: |
          set -euo pipefail
          pct="$(awk '/^TOTAL/ {print $10}' "$RUNNER_TEMP/coverage-summary.txt")"
          value="${pct%\%}"
          color=$(awk -v v="$value" 'BEGIN {
            if (v >= 90) { print "brightgreen" }
            else if (v >= 80) { print "green" }
            else if (v >= 70) { print "yellowgreen" }
            else if (v >= 60) { print "yellow" }
            else if (v >= 50) { print "orange" }
            else { print "red" }
          }')
          mkdir -p coverage-badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s","cacheSeconds":300}\n' \
            "$pct" "$color" >coverage-badge/coverage.json

      # Sums the "N" in every "test result: ok. N passed;" line: tests that
      # *ran* under this instrumented pass, not tests that exist. `cargo
      # llvm-cov` doesn't instrument doctests without a nightly `--doctests`
      # flag, so this is unit + integration tests only, same scope as the
      # percentage above.
      - name: Compute the test-count badge endpoint
        run: |
          set -euo pipefail
          total="$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($(i + 1) == "passed;") sum += $i } END { print sum + 0 }' test-run.log)"
          mkdir -p coverage-badge
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"blue","cacheSeconds":300}\n' \
            "$total" >coverage-badge/tests.json

      # Read by pages.yml (newest successful run on `main`) and docker.yml's
      # release job (the run for the tagged commit), keyed by this artifact
      # name.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: coverage-badge
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 90

      # Last, after both uploads, so the report is there to read when this
      # fails. A red run is not "successful", so pages.yml keeps serving the
      # previous badge until coverage is back above the floor.
      - name: Enforce the line-coverage floor
        run: scripts/check.sh coverage-floor

  pr:
    name: coverage (pull request)
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory: a figure on a PR is information, not a gate. The main leg's
    # floor is what fails.
    continue-on-error: true
    permissions:
      contents: read
      # the cross-run read of main's latest coverage-badge artifact
      actions: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the stable toolchain (llvm-tools-preview)
        uses: $/.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      # Reads the `coverage` job's cache from main; never writes one of its own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
          save-if: false

      - uses: $/.github/actions/setup-tool
        with:
          tool: cargo-llvm-cov

      - name: Run the hermetic suite under instrumentation
        run: scripts/check.sh coverage-run

      - id: floor
        name: Check the line-coverage floor
        continue-on-error: true
        run: scripts/check.sh coverage-floor

      # The `coverage` job's own run on `main`, never a pull_request run (the
      # action's `event` filter), so a PR's figure is never its own baseline.
      - uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-badge
          dest-subdir: main-coverage
          event: workflow_run
          found-message: comparing with main's coverage run
          missing-message: no successful coverage run on main yet - the comment will show this PR's figure alone

      - name: Write the comment
        env:
          FLOOR_OUTCOME: ${{ steps.floor.outcome }}
        run: |
          set -euo pipefail
          summary="$(cargo llvm-cov report --summary-only)"
          pr_pct="$(awk '/^TOTAL/ {print $10}' <<<"$summary")"
          main_pct=""
          f="$RUNNER_TEMP/main-coverage/coverage.json"
          [ -f "$f" ] && main_pct="$(jq -r '.message // empty' "$f")"
          if [ -n "$main_pct" ]; then
            delta="$(awk -v a="${pr_pct%\%}" -v b="${main_pct%\%}" 'BEGIN { printf "%+.2f", a - b }')"
          else
            main_pct="unknown"
            delta="n/a"
          fi
          floor="$(sed -n 's/^COVERAGE_FLOOR_LINES=\([0-9.]*\).*/\1/p' scripts/check.sh)"
          if [ "$FLOOR_OUTCOME" = success ]; then met="met"; else met="**not met**"; fi
          mkdir -p "$RUNNER_TEMP/coverage-comment"
          {
            echo "<!-- coverage-comment -->"
            echo "### Line coverage (tier 1 suite)"
            echo
            echo "| | Lines |"
            echo "| --- | --- |"
            echo "| This PR | $pr_pct |"
            echo "| \`main\` | $main_pct |"
            echo "| Change | $delta |"
            echo "| Floor | ${floor}% ($met) |"
            echo
            echo "<details><summary>Per-file summary</summary>"
            echo
            echo '```'
            head -c 50000 <<<"$summary"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Advisory: updated on every push to this PR; it never blocks a merge."
          } >"$RUNNER_TEMP/coverage-comment/comment.md"
          cat "$RUNNER_TEMP/coverage-comment/comment.md" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment
          path: ${{ runner.temp }}/coverage-comment
          retention-days: 1
          if-no-files-found: error

  # The only job with a write token, and it checks nothing out: it downloads
  # the comment the `pr` job wrote in this same run and posts or edits it.
  comment:
    name: coverage (comment)
    needs: pr
    # Wherever `pr` ran (it has no `needs:`, so it is skipped only by its own
    # `if:`). The event check is redundant with that but stays: it is what
    # tells lint_workflows.sh (rule 4) this job never runs on workflow_run.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.pr.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-comment
          path: ${{ runner.temp }}/coverage-comment

      # One comment per PR, found by its marker and edited in place, so a
      # busy PR does not collect one per push.
      - name: Post or update the coverage comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/coverage-comment/comment.md"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- coverage-comment -->"))) | .id' |
            head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" >/dev/null
            echo "updated comment $id"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$body" >/dev/null
            echo "posted a new comment"
          fi
