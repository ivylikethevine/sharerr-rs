# Line/region coverage over the hermetic (tier 1) test suite, via
# cargo-llvm-cov.
#
# Tier 1 only, deliberately: this runs the same `cargo test --workspace
# --all-features --locked` ci.yml's `test` job does, not `--include-ignored`.
# The tier 2 suite drives a real Docker Compose stack (see CLAUDE.md and
# scripts/run_docker_tests.sh) and stays local and opt-in there too — coverage over a
# suite this workflow cannot run would just be a misleading percentage.
#
# Chained off a green CI run rather than `push: branches: [main]` directly:
# the README badge below needs a number that tracks the default branch, but
# only a tree `cargo test` already passed on is worth spending a full
# instrumented rebuild on. Instrumented builds don't share ci.yml's
# cache-friendly artifacts, so this does pay for its own full rebuild on
# every green merge to `main` — worth it for a badge that means something,
# not worth paying on every `pull_request` too, so that trigger is
# deliberately absent. See pages.yml's header for why a workflow_run trigger
# is safe despite zizmor's default suspicion of it: no job here checks out
# the triggering run's ref, and CI never runs `pull_request` from a fork with
# a token this job could reach.
name: Coverage

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession would otherwise run two full 20-minute
# instrumented builds back to back, each triggering its own pages.yml deploy
# via the workflow_run chain — the later one is what should ship.
concurrency:
  group: coverage
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo-llvm-cov (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # only a green push to main gets a fresh run; a manual dispatch passes
    # the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A direct `rustup` call, not dtolnay/rust-toolchain: see ci.yml's `fmt` job
      # for why — that action force-pushes every ref on each Rust release, which
      # orphans any SHA pin of it (zizmor's `impostor-commit`) within weeks.
      - name: Install the stable toolchain (llvm-tools-preview)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Instrumented and ordinary builds produce different target/ trees;
          # sharing a key with ci.yml's `test` job would thrash both caches.
          key: coverage
          # This workflow only runs on `main` (or a manual dispatch), so this
          # is mostly documentation of intent rather than a behaviour change —
          # see ci.yml's `test` job for the cache-budget reasoning it shares.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Pinned like every action above it: without a fixed version this could
      # install whatever published most recently, and a coverage run could
      # change under a commit that touched no code. ./setup-tool downloads the
      # pin as a release binary once per version and caches it, instead of a
      # fresh `cargo install --version 0.9.0 --locked` source build every run.
      - uses: $/.github/actions/setup-tool
        with:
          tool: cargo-llvm-cov

      # Collects profile data once; `report` below reads it twice (HTML, then
      # a plain-text summary) without re-running the suite either time. Teed
      # to a log so the test-count step below can sum it without a second,
      # uninstrumented compile of the same suite.
      - name: Run the hermetic suite under instrumentation
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --locked --no-report 2>&1 | tee test-run.log

      - name: Render the HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### Coverage (tier 1 suite only)"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # What the README badge reads: a shields.io "endpoint" badge
      # (https://img.shields.io/endpoint) pointing at pages.yml's published
      # copy of this file's content, rather than a Codecov upload — no
      # third-party account, no token to provision. It travels there as a
      # build artifact rather than a commit: `main` carries a ruleset (PR
      # required, protected ref, verified signatures) that no Actions
      # `git push` can satisfy, so pages.yml fetches the freshest copy of this
      # artifact and writes it into the site it already deploys instead. See
      # that workflow's own comments for the fetch side.
      #
      # The Lines column specifically, not Regions: `cargo-llvm-cov
      # report --summary-only`'s TOTAL row has three "N / Missed / Cover%"
      # triples in a fixed order (Regions, Functions, Lines), so the *first*
      # percentage on the line is Regions coverage, not Lines — field 10, not
      # field 4. Same trap this repo's own coverage-column notes already warn
      # about; getting the column wrong here would silently badge the wrong
      # number.
      - name: Compute the badge endpoint
        run: |
          set -euo pipefail
          pct="$(cargo llvm-cov report --summary-only | awk '/^TOTAL/ {print $10}')"
          value="${pct%\%}"
          color=$(awk -v v="$value" 'BEGIN {
            if (v >= 90) { print "brightgreen" }
            else if (v >= 80) { print "green" }
            else if (v >= 70) { print "yellowgreen" }
            else if (v >= 60) { print "yellow" }
            else if (v >= 50) { print "orange" }
            else { print "red" }
          }')
          mkdir -p coverage-badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s","color":"%s","cacheSeconds":300}\n' \
            "$pct" "$color" >coverage-badge/coverage.json

      # Sums the "N" in every "test result: ok. N passed;" line rather than
      # re-counting test functions with `cargo test -- --list` — that would
      # count tests that *exist*, not tests that *ran* under this same
      # instrumented pass, and would need a second, uninstrumented compile of
      # the whole suite to get it. `cargo llvm-cov` doesn't instrument
      # doctests without a nightly `--doctests` flag, so this is unit +
      # integration tests only, same scope as the coverage percentage above.
      - name: Compute the test-count badge endpoint
        run: |
          set -euo pipefail
          total="$(awk '/^test result: ok\./ { for (i = 1; i <= NF; i++) if ($(i + 1) == "passed;") sum += $i } END { print sum + 0 }' test-run.log)"
          mkdir -p coverage-badge
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"blue","cacheSeconds":300}\n' \
            "$total" >coverage-badge/tests.json

      # Read by pages.yml's own `Find the last coverage run` / `Fetch that
      # run's badge endpoint` steps, keyed by this artifact name — it queries
      # for the newest successful run of this workflow on `main` and pulls
      # whatever this step uploaded there. `if:` guards against uploading an
      # empty artifact if the steps above failed to produce either file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: hashFiles('coverage-badge/coverage.json', 'coverage-badge/tests.json') != ''
        with:
          name: coverage-badge
          path: coverage-badge
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 90
