# Line/region coverage over the hermetic (tier 1) test suite, via
# cargo-llvm-cov. Dispatch-only rather than on every push: instrumented builds
# do not share ci.yml's cache-friendly artifacts, so this pays for its own
# full rebuild every run — worth doing on demand, not on a timer nobody reads
# and not on every PR at the cost of doubling CI's wall-clock.
#
# Tier 1 only, deliberately: this runs the same `cargo test --workspace
# --all-features --locked` ci.yml's `test` job does, not `--include-ignored`.
# The tier 2 suite drives a real Docker Compose stack (see CLAUDE.md and
# scripts/run_docker_tests.sh) and stays local and opt-in there too — coverage over a
# suite this workflow cannot run would just be a misleading percentage.
name: Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo-llvm-cov (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          # Instrumented and ordinary builds produce different target/ trees;
          # sharing a key with ci.yml's `test` job would thrash both caches.
          key: coverage

      # Pinned like every action above it: `--locked` only honours the tool's
      # own lockfile, so without `--version` this still installs whatever
      # published most recently and a coverage run can change under a commit
      # that touched no code.
      - run: cargo install cargo-llvm-cov --version 0.9.0 --locked

      # Collects profile data once; `report` below reads it twice (HTML, then
      # a plain-text summary) without re-running the suite either time.
      - name: Run the hermetic suite under instrumentation
        run: cargo llvm-cov --workspace --all-features --locked --no-report

      - name: Render the HTML report
        run: cargo llvm-cov report --html --output-dir coverage-html

      # Codecov reads lcov, so the same profile data is rendered a third time
      # rather than re-run. `--fail-under-lines 0` is deliberately absent: the
      # gate on coverage is review, not a number this workflow enforces.
      - name: Render the lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo "### Coverage (tier 1 suite only)"
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # What the README badge reads. The upload is what makes the number public;
      # the HTML artifact below is what makes it explorable, and neither
      # replaces the other.
      #
      # Because this workflow is dispatch-only (see the header), the badge shows
      # the coverage of the last run somebody asked for, not of the last commit.
      # Adding `push: branches: [main]` to the triggers above is what would make
      # it track the default branch — at the cost of the full instrumented
      # rebuild the header declines to pay on every push.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          # Tier 1 only, matching what was actually instrumented.
          flags: tier1
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 90
