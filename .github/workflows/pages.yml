# Builds README.md and docs/*.md into a static site with Jekyll and publishes it
# to GitHub Pages. Scoped to the paths that actually feed the site, so a Rust-only
# push doesn't trigger a rebuild that would produce byte-identical output.
#
# Requires GitHub Pages to be enabled once, with Source set to "GitHub Actions",
# under the repo's Settings > Pages.

name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "_config.yml"
      - "Gemfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push wins over a stale one still
# in flight rather than queuing behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
