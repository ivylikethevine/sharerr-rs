# Builds README.md and docs/*.md into a static site with Jekyll and publishes it
# to GitHub Pages. Scoped to the paths that actually feed the site, so a Rust-only
# push doesn't trigger a rebuild that would produce byte-identical output — except
# for coverage.yml's own runs, which carry no path filter of their own; see the
# `workflow_run` trigger below for why.
#
# Requires GitHub Pages to be enabled once, with Source set to "GitHub Actions",
# under the repo's Settings > Pages.

name: Deploy docs to Pages

# `workflow_run` is the usual dangerous-triggers shape in name only: the
# flagged risk is a privileged run checking out the head SHA of whatever
# triggered it and building from attacker-controlled content. This one does
# not. `build`'s checkout carries no `ref:`, so it always builds the default
# branch; the coverage figure comes from an API query for the newest green
# coverage.yml run on `main` rather than from the triggering run's own
# payload; and coverage.yml itself never runs on `pull_request` — so there is
# no attacker-controlled byte anywhere in the path. Every other workflow in
# this repo that chains off a green CI run the same way (coverage.yml,
# advisories.yml, image-scan.yml, link-check.yml, scorecard.yml,
# tool-versions.yml) points back to this comment rather than repeating it.
on: # zizmor: ignore[dangerous-triggers]
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "_config.yml"
      - ".github/workflows/pages.yml"
  # Redeploys the site whenever coverage.yml finishes on `main`, so a refreshed
  # coverage-badge artifact actually reaches the published badges/coverage.json
  # rather than freezing at whatever the last docs-touching push happened to
  # carry — coverage.yml runs on every merge to main, none of which necessarily
  # touch the paths above.
  workflow_run:
    workflows: [Coverage]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; a newer push wins over a stale one still
# in flight rather than queuing behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed coverage run must not redeploy the site with a stale or missing
    # badge; the other two triggers have no run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # actions: read is for the cross-workflow artifact read below — the site
    # build itself still needs nothing but contents.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The coverage and test-count badges, written straight into _site after
      # Jekyll has run: the files need no front matter and no _config.yml
      # exclusion to survive the build untouched. Looked up by API query for
      # the newest successful coverage.yml run on `main`, rather than off the
      # triggering event's own payload — that serves `push` and
      # `workflow_dispatch` runs the same way it serves `workflow_run`, with
      # one code path, via ./fetch-latest-artifact.
      - name: Fetch the last coverage run's badge endpoints
        id: cov-run
        uses: $/.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-badge
          dest-subdir: cov
          found-message: coverage figures from run
          missing-message: no successful coverage run on main yet - the badges stay 'not measured'

      # jekyll-build-pages is a *container* action - it runs as root inside
      # docker, so _site comes back root-owned and a plain mkdir under it is
      # denied without the chown first.
      - name: Write the shields endpoints
        env:
          COVJSON: ${{ runner.temp }}/cov/coverage.json
          TESTSJSON: ${{ runner.temp }}/cov/tests.json
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/badges
          if [ -f "$COVJSON" ]; then
            cp "$COVJSON" _site/badges/coverage.json
            echo "coverage badge: $(cat _site/badges/coverage.json)"
          else
            printf '{"schemaVersion":1,"label":"coverage","message":"not measured","color":"inactive","cacheSeconds":300}\n' \
              >_site/badges/coverage.json
            echo "::warning::no coverage artifact to read - badge published as 'not measured'"
          fi
          if [ -f "$TESTSJSON" ]; then
            cp "$TESTSJSON" _site/badges/tests.json
            echo "tests badge: $(cat _site/badges/tests.json)"
          else
            printf '{"schemaVersion":1,"label":"tests","message":"not measured","color":"inactive","cacheSeconds":300}\n' \
              >_site/badges/tests.json
            echo "::warning::no coverage artifact to read - tests badge published as 'not measured'"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
