# Builds README.md and docs/*.md into a static site with Jekyll and publishes it
# to GitHub Pages. Scoped to the paths that actually feed the site, so a Rust-only
# push doesn't trigger a rebuild that would produce byte-identical output — except
# for coverage.yml's own runs, which carry no path filter of their own; see the
# `workflow_run` trigger below for why.
#
# Requires GitHub Pages to be enabled once, with Source set to "GitHub Actions",
# under the repo's Settings > Pages.

name: Deploy docs to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "_config.yml"
      - ".github/workflows/pages.yml"
  # Redeploys the site whenever coverage.yml finishes on `main`, so a refreshed
  # coverage-badge artifact actually reaches the published badges/coverage.json
  # rather than freezing at whatever the last docs-touching push happened to
  # carry — coverage.yml runs on every merge to main, none of which necessarily
  # touch the paths above. See .github/zizmor.yml's dangerous-triggers entry
  # for why this is safe despite zizmor's default suspicion of workflow_run.
  workflow_run:
    workflows: [Coverage]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; a newer push wins over a stale one still
# in flight rather than queuing behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A failed coverage run must not redeploy the site with a stale or missing
    # badge; the other two triggers have no run to judge.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # actions: read is for the cross-workflow artifact read below — the site
    # build itself still needs nothing but contents.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # The coverage badge, written straight into _site after Jekyll has run:
      # the file needs no front matter and no _config.yml exclusion to survive
      # the build untouched. Looked up by API query for the newest successful
      # coverage.yml run on `main`, rather than off the triggering event's own
      # payload — that serves `push` and `workflow_dispatch` runs the same way
      # it serves `workflow_run`, with one code path.
      - name: Find the last coverage run
        id: cov-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/$REPO/actions/workflows/coverage.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          if [ -n "$run_id" ]; then
            echo "coverage figure from run $run_id"
          else
            echo "no successful coverage run on main yet - the badge stays 'not measured'"
          fi

      # continue-on-error, not a gate: an expired or missing artifact is a grey
      # badge, not a failed site deploy.
      - name: Fetch that run's badge endpoint
        if: steps.cov-run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/cov
          run-id: ${{ steps.cov-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # jekyll-build-pages is a *container* action - it runs as root inside
      # docker, so _site comes back root-owned and a plain mkdir under it is
      # denied without the chown first.
      - name: Write the shields endpoint
        env:
          COVJSON: ${{ runner.temp }}/cov/coverage.json
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" _site
          mkdir -p _site/badges
          if [ -f "$COVJSON" ]; then
            cp "$COVJSON" _site/badges/coverage.json
            echo "coverage badge: $(cat _site/badges/coverage.json)"
          else
            printf '{"schemaVersion":1,"label":"coverage","message":"not measured","color":"inactive","cacheSeconds":300}\n' \
              >_site/badges/coverage.json
            echo "::warning::no coverage artifact to read - badge published as 'not measured'"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
