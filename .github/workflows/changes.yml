# Detects whether a push or pull_request touched anything outside
# `.github/workflows/**`, so ci.yml, docker.yml, and docker-lighthouse.yml can
# each skip their expensive jobs on a workflow-only change without three
# copies of the same checkout-then-paths-filter steps drifting apart.
#
# `filters` is the one thing that differs between callers: ci.yml and
# docker.yml both want "anything except the workflow files themselves",
# docker-lighthouse.yml wants only the paths that actually feed its image. See
# each caller's own `uses:` block for its filter.
name: Detect changes

on:
  workflow_call:
    inputs:
      filters:
        description: >
          `dorny/paths-filter` filter rules (YAML), with a single key "code" —
          the fileset downstream jobs should treat as "something changed".
        required: true
        type: string
    outputs:
      code:
        description: "'true' if a file matching `inputs.filters`'s \"code\" key changed."
        value: ${{ jobs.changes.outputs.code }}

permissions: {}

jobs:
  changes:
    name: detect changes
    # No `if:` here, deliberately: whether this should run at all (push/
    # pull_request only, not schedule or workflow_dispatch) is each caller's
    # own call, made on the job that does `uses: ./.github/workflows/
    # changes.yml` — a skipped *calling* job reports `result: skipped` the
    # same way any other skipped job does, which is what the downstream
    # `needs.changes.result == 'skipped'` checks depend on. Putting the
    # condition in here instead would gate it on this *inner* job's own skip
    # status propagating back through the reusable-workflow call, which is
    # unverified and not worth risking against a check every other job's
    # `if:` relies on.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # some-with-excludes, not the default `some`: a bare negated pattern
      # matches nothing on its own (picomatch needs a positive rule to negate
      # against), and plain `some` would also count workflow files toward a
      # match since `**` matches those too. This is the combination that
      # actually means "some changed file lives outside .github/workflows/**"
      # for callers whose filter uses a negated pattern; it has no effect on
      # a caller (docker-lighthouse.yml) whose filter has none.
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: ${{ inputs.filters }}
