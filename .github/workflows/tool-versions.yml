name: Tool versions

# Weekly drift check over the tools ./setup-tool installs from a pinned
# release asset — the one class of pin dependabot cannot see
# (.github/dependabot.yml's header says so). Everything under `uses:` is
# dependabot's; hadolint and trivy are deliberately unpinned; what is left is
# zizmor, actionlint, cargo-llvm-cov, lychee and typos, whose versions live in
# .github/actions/setup-tool/tools.txt and move only when somebody edits them.
#
# The signal is one tracking issue, kept current: opened when a pin is behind,
# rewritten with the current table on every later run, closed by the run that
# finds everything current. A stale pin is a standing state, not an event, and
# a ::warning in a scheduled run that nobody opens is a signal only in the sense
# that a tree falling in a forest is. The annotations stay too, for whoever does
# open the run. The bump itself stays a one-line edit to tools.txt.
#
# Also runs on every push to main, alongside the weekly cron, so a bump to
# tools.txt (or its absence, when upstream moved and nobody bumped it) shows up
# at merge time too — the cron stays for drift that happens with no commit at
# all.
#
# Serialised rather than cancel-on-superseded (see the concurrency: block
# below): upsert-tracking-issue's list-then-create is not safe to run twice at
# once, and this job is a few minutes, not the ~25 of image-scan's `pins`.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: tool-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: pinned CI tools vs upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # The script exits with the number of outdated pins; captured as an
      # output rather than failing the step, so the issue below can be closed
      # on the zero and opened on the rest. A missing upstream answer prints a
      # row and counts as current, which is the script's own call — a rate
      # limit is not a stale pin.
      - id: check
        name: Compare pinned versions to upstream releases
        env:
          # raises the releases API rate limit well above the roster size
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/drift-table.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Build the report
        if: steps.check.outputs.outdated != '0'
        env:
          OUTDATED: ${{ steps.check.outputs.outdated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "$OUTDATED pinned tool(s) are behind upstream."
            echo "Bump each one in .github/actions/setup-tool/tools.txt; the drift check reads the same file."
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift-table.txt"
            echo '```'
            echo
            echo "Found by [\`tool-versions\`]($RUN_URL). Closed automatically once every pin is current."
          } >"$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"

      # See .github/actions/upsert-tracking-issue for the shape this,
      # advisories.yml, and image-scan.yml's `pins` job all share.
      - name: Keep the tracking issue current
        uses: ./.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A tool version pinned in a workflow is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.outdated == '0' }}
          close-comment: >-
            Every pin is current again.
            [Latest run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          body-file: ${{ runner.temp }}/report.md
