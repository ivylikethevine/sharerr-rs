name: Tool versions

# Weekly drift check over the tools CI installs by pip and `go install` — the
# one class of pin dependabot cannot see (.github/dependabot.yml's header says
# so). Everything under `uses:` is dependabot's; hadolint and trivy are
# deliberately unpinned; what is left is zizmor and actionlint, whose versions
# live in a `run:` line and move only when somebody edits them.
#
# The signal is one tracking issue, kept current: opened when a pin is behind,
# rewritten with the current table on every later run, closed by the run that
# finds everything current. A stale pin is a standing state, not an event, and
# a ::warning in a scheduled run that nobody opens is a signal only in the sense
# that a tree falling in a forest is. The annotations stay too, for whoever does
# open the run. The bump itself stays a one-line edit to ci.yml.

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: pinned CI tools vs upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # The script exits with the number of outdated pins; captured as an
      # output rather than failing the step, so the issue below can be closed
      # on the zero and opened on the rest. A missing upstream answer prints a
      # row and counts as current, which is the script's own call — a rate
      # limit is not a stale pin.
      - id: check
        name: Compare pinned versions to upstream releases
        env:
          # raises the releases API rate limit well above the roster size
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/tools.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Keep the tracking issue current
        env:
          GH_TOKEN: ${{ github.token }}
          OUTDATED: ${{ steps.check.outputs.outdated }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label=tool-versions
          title="Pinned CI tools are behind their upstream releases"

          # --force is create-or-update, so a deleted label heals itself rather
          # than turning every later `issue create` into a hard failure
          gh label create "$label" --force --color 0E8A16 \
            --description "A tool version pinned in a workflow is behind upstream" >/dev/null

          # one issue, reused: the finding is a standing state of the pins, not
          # an event, so a new issue per weekly run would be pure noise
          open="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"

          if [ "$OUTDATED" = 0 ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Every pin is current again. [Latest run]($RUN_URL)."
            fi
            echo "every pin is current"
            exit 0
          fi

          report="$RUNNER_TEMP/report.md"
          {
            echo "$OUTDATED pinned tool(s) are behind upstream."
            echo "Bump each one where it is installed; the drift check reads the same line."
            echo
            echo '```'
            cat "$RUNNER_TEMP/tools.txt"
            echo '```'
            echo
            echo "Found by [\`tool-versions\`]($RUN_URL). Closed automatically once every pin is current."
          } >"$report"
          cat "$report" >>"$GITHUB_STEP_SUMMARY"

          # --body-file, not --body: the table is a code block with blank lines,
          # and a YAML-indented shell string would arrive indented into it
          if [ -n "$open" ]; then
            gh issue edit "$open" --title "$title" --body-file "$report"
            echo "updated #$open"
          else
            gh issue create --label "$label" --title "$title" --body-file "$report"
          fi
