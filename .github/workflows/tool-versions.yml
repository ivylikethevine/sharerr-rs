name: Tool versions

# Weekly drift check over the pins dependabot cannot see
# (.github/dependabot.yml's header lists them): every tool in
# .github/actions/setup-tool/tools.txt, and the inline pins listed in
# .github/scripts/check_tool_versions.local.sh (cargo-chef in docker/Dockerfile,
# the .mcp.json server, the Pages theme). It also re-checks action SHAs and
# image digests, so an unmerged dependabot bump shows up here too, and that
# the MSRV agrees across its three places.
#
# The signal is one tracking issue, kept current: opened when a pin is behind,
# rewritten with the current table on every later run, closed by the run that
# finds everything current. A stale pin is a standing state, not an event, and
# a ::warning in a scheduled run that nobody opens is a signal only in the sense
# that a tree falling in a forest is. The annotations stay too, for whoever does
# open the run. The bump itself stays a one-line edit where the report says.
#
# Timing matches dependabot's. Both run on Monday (dependabot at its 05:00 UTC
# default, this cron two hours later, so its PRs exist before this check
# runs), and check_tool_versions.sh applies the same 7-day cooldown that
# dependabot.yml's `cooldown:` blocks do: a release younger than a week is
# reported as pending, not as drift, so this issue never opens for a bump
# dependabot is deliberately not proposing yet.
#
# Also chained off every green CI run on main, alongside the weekly cron, so
# a bump to tools.txt (or its absence, when upstream moved and nobody bumped
# it) shows up at merge time too — the cron stays for drift that happens with
# no commit at all. Gated on green rather than a bare `push` — see pages.yml's
# header for why a workflow_run trigger is safe despite zizmor's default
# suspicion of it.
#
# Serialised rather than cancel-on-superseded (see the concurrency: block
# below): upsert-tracking-issue's list-then-create is not safe to run twice at
# once, and this job is a few minutes, not the ~25 of image-scan's `pins`.

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: tool-versions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: pinned CI tools vs upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # only a green push to main gets a fresh check; the schedule and a manual
    # dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      # the one write this job does: upsert (and close) its own tracking issue
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # The script exits with the number of problems; captured as an
      # output rather than failing the step, so the issue below can be closed
      # on the zero and opened on the rest. A missing upstream answer prints a
      # row and counts as current, which is the script's own call — a rate
      # limit is not a stale pin.
      - id: check
        name: Compare pinned versions to upstream releases
        env:
          # raises the releases API rate limit well above the roster size
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check_tool_versions.sh | tee "$RUNNER_TEMP/drift-table.txt" || rc=$?
          echo "outdated=$rc" >>"$GITHUB_OUTPUT"

      - name: Build the report
        if: steps.check.outputs.outdated != '0'
        env:
          OUTDATED: ${{ steps.check.outputs.outdated }}
        run: |
          set -euo pipefail
          {
            echo "The drift check reported $OUTDATED problem(s)."
            echo
            echo "- tools.txt rows: bump pin and sha256 together in \`.github/actions/setup-tool/tools.txt\`."
            echo "- Inline pins: edit the file their row names in \`.github/scripts/check_tool_versions.local.sh\`."
            echo "- Action SHAs and image digests: merge dependabot's open bump PR."
            echo "- MSRV: make Cargo.toml, docker/Dockerfile and ci.yml's msrv job agree."
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift-table.txt"
            echo '```'
          } >"$RUNNER_TEMP/report.md"

      # See .github/actions/upsert-tracking-issue for the shape this,
      # advisories.yml, and image-scan.yml's `pins` job all share.
      - name: Keep the tracking issue current
        uses: $/.github/actions/upsert-tracking-issue
        with:
          label: tool-versions
          label-color: 0E8A16
          label-description: A tool version pinned in a workflow is behind upstream
          title: Pinned CI tools are behind their upstream releases
          resolved: ${{ steps.check.outputs.outdated == '0' }}
          close-comment: Every pin is current again.
          resolved-when: every pin is current
          body-file: ${{ runner.temp }}/report.md
