# The two questions every heavy job in ci.yml and docker.yml asks before it
# starts, answered in one VM so a caller pays that latency once.
#
# Which runner. `vars.RUNNER_LABEL` names a self-hosted machine, and unlike a
# secret it is not withheld from a fork's `pull_request` run, which runs the
# fork's own workflow file; reading it in `runs-on:` would land fork code on
# that machine. This is the one place that checks for a fork, and every other
# job reads its `label` output instead of the variable.
#
# Whether anything relevant changed. Each caller passes its own filter, so
# `code` means what can move that caller's result (a Rust result for ci.yml, an
# image for docker.yml); extra keys come back in `changes` (ci.yml's
# `terraform` and `deps`, docker.yml's `lighthouse`). With no diff to filter
# (a schedule or dispatch), every key counts as changed, so a caller checks
# `needs.prepare.outputs.code == 'true'` and nothing else.
name: Prepare

on:
  workflow_call:
    inputs:
      filters:
        description: >
          `dorny/paths-filter` filter rules (YAML), with a key "code" — the
          fileset downstream jobs should treat as "something changed" — and
          optionally more keys, read back through the `changes` output.
        required: true
        type: string
    outputs:
      label:
        description: The runner label every other job in the caller should use.
        value: ${{ jobs.prepare.outputs.label }}
      code:
        description: >
          'true' if a file matching `inputs.filters`'s "code" key changed, or if
          the triggering event is not push/pull_request (schedule, dispatch —
          treated as "everything changed", since there is no diff to filter).
        value: ${{ jobs.prepare.outputs.code }}
      changes:
        description: >
          A JSON array of the `inputs.filters` keys that matched, or of every
          key when there is no diff to filter (the same events as `code`).
          Test one with `contains(fromJSON(needs.prepare.outputs.changes), 'key')`.
        value: ${{ jobs.prepare.outputs.changes }}

# Every step below only reads github.event/vars or lists a PR's changed files —
# nothing here needs a scope broader than the one read permission the paths
# filter requires.
permissions:
  pull-requests: read

jobs:
  prepare:
    name: prepare
    # Always hosted, deliberately: this decides whether anything else in the
    # calling workflow reaches the self-hosted box, so it cannot be the thing a
    # fork PR could already redirect.
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      label: ${{ steps.pick.outputs.label }}
      code: ${{ steps.decide.outputs.code }}
      changes: ${{ steps.decide.outputs.changes }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # Through env:, not inlined into the run: line — a template expanded
      # straight into a shell command is exactly what a crafted PR title or
      # branch name could abuse if it ever appeared here.
      - id: pick
        env:
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          LABEL: ${{ vars.RUNNER_LABEL }}
        run: |
          set -euo pipefail
          if [ "$FORK" = "true" ]; then
            echo "label=ubuntu-26.04" >>"$GITHUB_OUTPUT"
            echo "::notice title=runner::fork PR - GitHub-hosted only, ignoring RUNNER_LABEL"
          else
            echo "label=${LABEL:-ubuntu-26.04}" >>"$GITHUB_OUTPUT"
          fi

      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # some-with-excludes, not the default `some`: a bare negated pattern
      # matches nothing on its own (picomatch needs a positive rule to negate
      # against), and plain `some` would also count workflow files toward a
      # match since `**` matches those too. This is the combination that
      # actually means "some changed file lives outside .github/workflows/**"
      # for callers whose filter uses a negated pattern; it has no effect on a
      # caller (docker.yml's `lighthouse` job) whose filter has none.
      # The files no caller's `code` counts, kept once here: a caller's key
      # lists `- *not-code` and paths-filter flattens the alias. Only
      # negations, so the `not-code` key itself never matches. Not `docs/**`
      # wholesale: crates/sharerr/src/openapi.rs reads docs/openapi.json in a
      # test, so that file is code.
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filters
        env:
          CALLER: ${{ inputs.filters }}
        run: |
          set -euo pipefail
          {
            echo 'yaml<<FILTERS_EOF'
            cat <<'SHARED'
          not-code: &not-code
            - '!**/*.md'
            - '!docs/screenshots/**'
            - '!.editorconfig'
            - '!.gitattributes'
            - '!.gitignore'
            - '!.markdownlint.yaml'
            - '!.moxide.toml'
            - '!.prettierrc.yaml'
            - '!.scorecard.yml'
            - '!.shellcheckrc'
            - '!.vscode/**'
            - '!.zed/**'
            - '!LICENSE.md'
            - '!LICENSES/**'
            - '!REUSE.toml'
            - '!_config.yml'
            - '!lychee.toml'
            - '!scripts/scratch/**'
          SHARED
            printf '%s\n' "$CALLER"
            echo 'FILTERS_EOF'
          } >>"$GITHUB_OUTPUT"

      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: ${{ steps.filters.outputs.yaml }}

      # Collapses the filter's answer and "there was no diff to filter" into
      # one answer each for `code` and `changes`, so every downstream job
      # checks one thing instead of two. With no diff, `changes` lists every
      # top-level key of the filters (a key starts its line; its patterns and
      # any comment do not).
      - id: decide
        env:
          FILTERED: ${{ steps.filter.outcome == 'success' }}
          MATCHED: ${{ steps.filter.outputs.code }}
          CHANGES: ${{ steps.filter.outputs.changes }}
          FILTERS: ${{ inputs.filters }}
        run: |
          set -euo pipefail
          if [ "$FILTERED" = "true" ]; then
            printf 'code=%s\nchanges=%s\n' "$MATCHED" "$CHANGES" >>"$GITHUB_OUTPUT"
          else
            keys="$(printf '%s\n' "$FILTERS" | sed -n 's/^\([A-Za-z0-9_-]\{1,\}\):.*/\1/p' | jq -cRn '[inputs]')"
            printf 'code=true\nchanges=%s\n' "$keys" >>"$GITHUB_OUTPUT"
          fi
