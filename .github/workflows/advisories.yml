name: Advisories

# The tracking-issue half of ci.yml's dependency audit, over Cargo.lock
# (cargo-deny's `advisories` check; licenses, bans and sources only fail on
# what a diff changed) and .github/package-lock.json (npm audit). ci.yml's
# audit job blocks a pull request whose locks carry a known advisory; an
# advisory published later against locks nobody touched would only turn a
# scheduled run red. So this keeps one `advisories` issue current: opened on
# a finding, rewritten while it stands, closed by the run that finds
# everything clean. It never blocks anything.
#
# Runs after every green CI run on a push to main (a merge can bring in an
# already-published advisory), weekly (advisories land with no push here), and
# on dispatch. workflow_run is safe here: the job runs only after a green push
# to main.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a run cancelled mid-upsert can leave the tracking
# issue half-written or open a duplicate.
concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  advisories:
    name: dependency advisories (cargo-deny + npm audit, advisory)
    # only a green push to main; the schedule and a dispatch pass the first clause
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open, refresh or close the tracking issue
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the tools.txt pin ci.yml's audit gate runs; the advisory database is
      # fetched fresh every run
      - uses: ./.github/actions/setup-tool
        with:
          tool: cargo-deny

      # Each tool exits non-zero on a finding and on a failure alike. cargo-deny
      # names an advisory (RUSTSEC-...) or a yanked crate in a finding, and npm
      # audit's JSON carries a vulnerability count only when the audit ran, so
      # a failed audit fails the job instead of opening an issue.
      - id: audit
        name: Audit the locks
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/advisories.md"
          found=0
          echo "Known advisories affect locked dependencies. The fix is usually the Dependabot bump or a" >"$report"
          echo "\`cargo update -p <crate>\`; with no patched version yet, an \`[advisories] ignore\` entry in" >>"$report"
          echo "\`deny.toml\` **with a comment saying why**." >>"$report"

          rc=0
          cargo deny check advisories >"$RUNNER_TEMP/cargo-deny.txt" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            if ! grep -qE 'RUSTSEC-|yanked' "$RUNNER_TEMP/cargo-deny.txt"; then
              cat "$RUNNER_TEMP/cargo-deny.txt"
              echo "::error title=cargo-deny::the audit did not run (exit $rc)"
              exit 1
            fi
            found=1
            {
              echo
              echo "### Rust crates (cargo-deny)"
              echo
              echo "\`Cargo.lock\`:"
              echo
              echo '````'
              cat "$RUNNER_TEMP/cargo-deny.txt"
              echo '````'
            } >>"$report"
          fi

          rc=0
          npm audit --prefix .github --json >"$RUNNER_TEMP/npm-audit.json" || rc=$?
          total="$(jq -r '.metadata.vulnerabilities.total // empty' "$RUNNER_TEMP/npm-audit.json" 2>/dev/null)"
          if [ -z "$total" ]; then
            cat "$RUNNER_TEMP/npm-audit.json"
            echo "::error title=npm audit::the audit did not run (exit $rc)"
            exit 1
          fi
          if [ "$total" -gt 0 ]; then
            found=1
            {
              echo
              echo "### Markdown tools (npm audit)"
              echo
              echo "\`.github/package-lock.json\`:"
              echo
              echo '````'
              npm audit --prefix .github || true
              echo '````'
            } >>"$report"
          fi

          cat "$report"
          echo "found=$found" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: advisories
          label-color: B60205
          label-description: A known advisory affects a locked dependency
          title: Known advisories affect locked dependencies
          resolved: ${{ steps.audit.outputs.found == '0' }}
          close-comment: cargo-deny and npm audit report nothing against the current locks.
          resolved-when: cargo-deny and npm audit both report nothing
          body-file: ${{ runner.temp }}/advisories.md
          warning-title: advisories
          warning-body: A known advisory affects a locked dependency - see the advisories issue
