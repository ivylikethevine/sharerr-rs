# Builds `docker/Dockerfile`'s `runtime-sharerr` target and publishes it to
# GHCR. Everything about how that happens — the unattended sha-tag path on a
# `main` push, the approval-gated `v*` tag path, the workflow_dispatch
# rehearsal, the amd64-only PR build, the cache strategy — lives in
# docker-image.yml, shared with docker-lighthouse.yml. See that file for the
# reasoning behind each of those choices; only what is specific to *this*
# image is here.

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Covers the whole run including the called workflow — this is what keeps a
# quick follow-up push from leaving a superseded build running, without
# sharing a queue with docker-lighthouse.yml's own group.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# A job-level `permissions:` block fully replaces this default for that job
# — it doesn't intersect with it — and both jobs below already declare their
# own, so this has no effect on either today. It exists so a future job added
# without its own block defaults to least-privilege rather than the runner's
# permissive default, and because Scorecard's Token-Permissions check looks
# for a top-level declaration specifically, independent of whether any job
# actually relies on it.
permissions:
  contents: read

jobs:
  # A called workflow's jobs cannot request a permission this job does not
  # hold — every scope any job inside docker-image.yml needs (including the
  # nested `prepare` call's `pull-requests: read`) has to be granted here.
  # Named after the image, not a bare `docker`: this and docker-lighthouse.yml
  # both call docker-image.yml, and their `build` checks would otherwise both
  # report as `docker / build` — one name two checks share cannot be required
  # by `main`'s ruleset unambiguously.
  docker:
    name: docker (sharerr)
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/docker-image.yml
    with:
      # GHCR rejects uppercase paths. `github.repository` happens to be
      # all-lowercase today, so no normalisation is needed — worth
      # remembering if the repo is ever moved under an org whose name has
      # capitals in it.
      image: ghcr.io/${{ github.repository }}
      target: runtime-sharerr
      cache-scope: sharerr
      publish-concurrency-group: release-docker
      # Anything outside .github/workflows/** — a workflow-only change can't
      # move what this image builds. Tag pushes bypass this filter entirely
      # (docker-image.yml's own `build` job `if:`).
      filters: |
        code:
          - '**'
          - '!.github/workflows/**'
          - '!**/*.md'
          - '!docs/screenshots/**'

  # Only on a real `v*` tag push, and only after `docker`'s own `publish` job
  # has cleared its `environment: release` approval — `needs: docker` inherits
  # that gate rather than asking for a second one, so cutting a release is
  # still one approval, not two. Lives in this file rather than a standalone
  # release.yml because there is no cross-workflow `needs:` in Actions; a
  # `workflow_run`-triggered release would have to poll GitHub to learn
  # whether docker-lighthouse.yml's own build also succeeded for this tag,
  # which is exactly the coupling docs/RELEASING.md's "a break in one build
  # cannot hold the other's release" deliberately avoids. A lighthouse build
  # failure therefore does not block this job — the release still ships,
  # describing whichever images actually published.
  release:
    name: create the GitHub Release
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this tree that needs it - `gh release create` writes a
    # Releases-tab entry and, if the tag somehow didn't already exist, the tag
    # itself. Nothing else here pushes back to GitHub.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No tag-versus-Cargo.toml check here any more: the tag *is* the version
      # (docs/RELEASING.md, "Cutting a release"), and docker-image.yml's
      # `version` step rejects a malformed tag before `build` pushes anything.
      # The check this job used to run sat after `publish` had already moved
      # `latest`, which was the wrong side of the gate to fail on.

      # The preamble GitHub's generated notes get prepended to below - see
      # docs/RELEASING.md's own "Verifying a published image" section, which
      # this restates so a reader of the release page never has to leave it.
      - name: Write the release preamble
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          {
            echo "## Images"
            echo
            echo '```'
            echo "docker pull ghcr.io/${REPO}:${TAG}"
            echo "docker pull ghcr.io/${OWNER}/sharerr-lighthouse:${TAG}"
            echo '```'
            echo
            echo "## Verifying what shipped"
            echo
            echo '```'
            echo "gh attestation verify oci://ghcr.io/${REPO}:${TAG} --repo ${REPO}"
            echo "gh attestation verify oci://ghcr.io/${OWNER}/sharerr-lighthouse:${TAG} --repo ${REPO}"
            echo '```'
            echo
            echo "See [docs/RELEASING.md](https://github.com/${REPO}/blob/${TAG}/docs/RELEASING.md) for what these commands prove."
          } >"$RUNNER_TEMP/preamble.md"

      # `--verify-tag` is redundant given the `if:` above already requires a
      # real tag push, but it costs nothing and turns a race or a misfired
      # dispatch into a loud failure instead of a release built from whatever
      # the default branch happened to be. `--generate-notes` derives the rest
      # from merged PR titles since the last tag - the model
      # docs/SUPPORT.md's "A maintained CHANGELOG.md" section names as the
      # replacement for a hand-written changelog, not a `CHANGELOG.md` file.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          case "$TAG" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/preamble.md" \
            "${prerelease_flag[@]}"
