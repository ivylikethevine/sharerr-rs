# Builds the image, and publishes it to GHCR on a `v*` tag only.
#
# Branch pushes and pull requests build both architectures but ship nothing. That
# split is deliberate: the build is load-bearing as the MSRV check (below), while
# publishing should be something you choose to do, not a side effect of merging.
#
# This also doubles as the MSRV check for the whole project. The Dockerfile's
# builder stage is pinned to the workspace's declared rust-version (1.88) while a
# developer's local toolchain is invariably newer, so a build here is the only
# thing that reliably catches code reaching past the MSRV. That is why pull
# requests build the image even though they never publish it.
#
# A `v*` tag no longer publishes straight to `:latest`/`:X.Y.Z` unattended: `build`
# pushes the real, fully-built multi-arch image to a provisional tag nobody would
# discover by browsing GHCR, and `publish` — gated behind a required reviewer, see
# the `environment: release` comment below — retags exactly that digest onto the
# tags an operator would actually pull. Nothing rebuilds between the two; a
# reviewer is approving the bytes that were already built and attested, not asking
# for a second, unaudited build to happen.

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; each job below elevates only the permission it needs,
# rather than every job inheriting `packages: write` whether it pushes or not.
permissions:
  contents: read

env:
  # GHCR rejects uppercase paths. `github.repository` happens to be all-lowercase
  # today, so no normalisation is needed — worth remembering if the repo is ever
  # moved under an org whose name has capitals in it.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Same gate as ci.yml's `changes` job — see the comment there. A push/PR
  # that only touches .github/workflows/** can't change what this workflow
  # would build, so there's nothing here for a 30-minute multi-arch build to
  # re-prove. Tag pushes bypass this entirely (see `build`'s `if:` below): a
  # release must build regardless of what the diff says.
  changes:
    name: detect changes
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!.github/workflows/**'

  # See runner.yml: keeps a fork's pull_request build off the self-hosted box
  # the same way ci.yml does. This workflow's `build` job never pushes on a
  # fork PR either way (see the login step's condition below), but it still
  # compiles the fork's own Dockerfile and Rust source, which is exactly the
  # code a fork PR should not get to run wherever RUNNER_LABEL points.
  runner:
    name: pick the runner
    uses: ./.github/workflows/runner.yml

  build:
    name: build
    needs: [runner, changes]
    if: >-
      needs.runner.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       needs.changes.result == 'skipped' ||
       needs.changes.outputs.code == 'true')
    runs-on: ${{ needs.runner.outputs.label }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Only actually exercised on a `v*` tag push — see the login step below —
      # but a job's permissions are fixed before any step's `if:` is evaluated,
      # so it has to be granted here regardless of which event triggered this run.
      packages: write
      id-token: write
      attestations: write
    outputs:
      # The tags this image should carry once approved — computed here from
      # metadata-action so `publish` promotes exactly what this build decided,
      # rather than re-deriving the same ref/semver logic a second time.
      tags: ${{ steps.meta.outputs.tags }}
      # Where `publish` finds the digest this job actually pushed.
      pending-ref: ${{ steps.pending.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # QEMU is needed for the arm64 leg, but only barely: the Dockerfile
      # cross-compiles the Rust build natively, so the only emulated work is the
      # runtime stage's apt-get and useradd. That is seconds, against the ~45
      # minutes an emulated `cargo build --release` would cost.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      # Required for --platform builds and for the type=gha cache backend.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only when something is actually going to be pushed. A PR from a fork gets a
      # read-only GITHUB_TOKEN, so logging in would fail for exactly the
      # contributors least equipped to diagnose it — and there is nothing to log in
      # for on a branch build either, now that only tags publish. Keep this
      # condition identical to `push:` below.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags this build *would* publish, computed either way: `publish`
      # reads this output regardless of whether this run pushes anything today.
      # Also emits the OCI labels, including org.opencontainers.image.source —
      # that label is what links the GHCR package back to this repo and lets it
      # inherit the repo's permissions.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # A tag nobody would find by browsing GHCR's tag list, named after the
      # commit rather than a counter so two runs of the same push never race
      # each other for it. This is where a `v*` tag's real build actually
      # lands — `publish` only ever points the human-facing tags at it.
      - id: pending
        env:
          SHA: ${{ github.sha }}
        run: echo "ref=${IMAGE}:pending-${SHA}" >>"$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A `v*` tag pushes to the provisional ref above and nowhere else —
          # the real tags computed by `meta` reach GHCR only once `publish` is
          # approved. Every other event keeps pushing nothing at all, exactly
          # as before: PR and branch builds still exist solely to compile,
          # which is what makes this job double as the MSRV gate.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && steps.pending.outputs.ref || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `mode=min`, not `max`. Exporting the intermediate builder stage would
          # push a multi-GB release target/ tree per architecture into a cache that
          # is 10 GB for the whole repository — evicting ci.yml's rust-cache — for a
          # layer that can never be reused anyway, since `COPY . .` sits before the
          # build and every commit changes its digest. What does get reused is the
          # runtime stage's emulated apt-get, and min covers that.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Signed proof that this exact digest was built by this workflow run, from
      # this commit — checkable later with `gh attestation verify <image> --repo
      # <owner>/<repo>` against whichever tag `publish` eventually points at it.
      # `push-to-registry` attaches it to the image in GHCR as an OCI referrer,
      # so it travels with the digest through the retag `publish` does below
      # rather than needing to be regenerated against the final tags.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The only job that publishes, and it waits for you.
  #
  # `environment: release` is what makes GitHub hold this job pending until a
  # required reviewer approves it in the web UI. THAT REVIEWER IS NOT CONFIGURED
  # BY THIS FILE — it is a repo setting, and until it exists the environment
  # imposes no gate at all and this job runs unattended. One-time setup:
  # Settings -> Environments -> New environment -> "release" -> tick "Required
  # reviewers" and add yourself (and anyone else who should be able to approve
  # a publish).
  publish:
    name: publish to GHCR (manual approval)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` needs the buildx CLI but builds nothing and needs no
      # emulation — it is a registry-side copy of an existing manifest list onto
      # new tags, which is what makes this job a retag rather than a rebuild.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Promote the approved image to its real tags
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          PENDING: ${{ needs.build.outputs.pending-ref }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<<"$TAGS"
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no tags computed by the build job — nothing to promote" >&2
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$PENDING"
