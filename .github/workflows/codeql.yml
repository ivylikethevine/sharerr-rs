name: CodeQL

# CodeQL over the two languages in this repo it can read: Rust and GitHub
# Actions.
#
# Rust analysis went generally available in CodeQL 2.23.3 (Oct 2025) and covers
# every OWASP Top 10 category except A06 (vulnerable and outdated components),
# where it defers to dependabot — which is exactly the split this repo already
# has, with cargo-deny and dependabot owning A06. The queries that earn their
# keep here are the cryptographic ones: sharerr's vault is argon2 and
# chacha20poly1305 over secrets that never touch `sharerr.toml`, and
# `rust/hard-coded-cryptographic-value` looks for precisely the mistake that
# code must not make — a hard-coded key, IV, nonce or salt.
#
# The `actions` half covers eight workflows, where the interesting bugs are
# expression injection into `run:`, an untrusted checkout feeding a privileged
# job, and artifact or cache poisoning. That overlaps with zizmor, which already
# gates every PR in ci.yml, and the overlap is the point rather than an
# accident: zizmor is a fast opinionated linter that fails the build, CodeQL is
# a slower dataflow analysis whose findings land in the Security tab with a
# trace. Where they agree, a finding is cheap to trust; where only one fires, it
# is worth reading. Neither replaces the other, and zizmor stays the gate.
#
# `build-mode: none` for both. Rust is a no-build language for CodeQL since the
# same 2.23.3 release, which matters here: a build mode would mean compiling the
# workspace a second time on every push, and this analysis has nothing to say
# that `cargo clippy` does not already say faster.

on:
  push:
    branches: [main]
  pull_request:
  # the default-branch baseline code scanning diffs a PR against. Without a
  # scheduled run the first PR to touch a file has nothing to compare to.
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Per-language change detection for pushes to main, so a docs-only merge
  # does not pay for either analysis leg. Deliberately not routed through
  # prepare.yml: this workflow never touches `vars.RUNNER_LABEL` (both legs
  # are pinned `ubuntu-latest` — CodeQL has nothing to gain from the
  # self-hosted box either), so it only needs the paths-filter half, with two
  # keys instead of prepare.yml's one.
  #
  # Pull requests deliberately bypass the filter and run both languages. The
  # `main` ruleset requires a CodeQL result before a PR can merge, and that
  # requirement waits for an upload on the PR head for every category the
  # tool has ever reported. A skipped leg uploads nothing, so a PR that
  # touched only `crates/` sat on "Code scanning is waiting for results from
  # CodeQL" indefinitely with no way to satisfy it. Schedule (the Tuesday
  # baseline run) and workflow_dispatch skip the filter for the same reason:
  # there is no diff to filter, and the baseline every PR gets diffed against
  # has to cover both languages.
  context:
    name: detect changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations/**'
            actions:
              - '.github/**'

  # Two named jobs rather than one `matrix.language: [rust, actions]` job with
  # a per-language `if:`, because job-level `if:` cannot read the `matrix`
  # context at all — actionlint rejects it outright, since the condition is
  # evaluated before the matrix is expanded. Splitting is also a better fit
  # for "one language failing should not hide the other's findings": each is
  # now its own job with its own visible pass/fail/skip, not a matrix cell.
  analyze-rust:
    name: CodeQL (rust)
    needs: context
    if: needs.context.result == 'skipped' || needs.context.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: rust
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:rust"

  analyze-actions:
    name: CodeQL (actions)
    needs: context
    if: needs.context.result == 'skipped' || needs.context.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # the SARIF upload, and the workflow definitions being analysed
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:actions"
