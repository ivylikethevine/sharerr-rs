# Builds one runtime target out of docker/Dockerfile. Called twice from
# docker.yml — once for target: runtime-sharerr, once for target:
# runtime-lighthouse — which used to be two separate workflow files each
# carrying their own copy of everything below. Everything that differs
# between the two images is now an `inputs.*` value; every comment on *why*
# each piece of this works the way it does lives here with the code it
# explains, and is not repeated in either caller job.
#
# This workflow only builds and attests; it does not publish. The one gated
# retag for both images lives in docker.yml's own `publish` job, downstream of both
# calls to this workflow, so that job can gate on *both* builds having
# succeeded before either image moves. See docker.yml for that job and the
# `environment: release` reasoning that used to live here.
#
# Every push to `main` ships unattended, under a tag that carries nothing but
# the commit sha — no `latest`, no branch name, nothing a human would stumble
# across browsing GHCR's tag list. See the `dest` step below for the exact
# format. A `v*` tag goes through the slower, gated path described below
# instead.
#
# That split is deliberate: the build is load-bearing as the MSRV check
# (below), while publishing the tags an operator would actually reach for —
# `latest`, a semver — should be something you choose to do, not a side
# effect of merging. The sha-only tag is a lower-stakes middle ground: it
# publishes unattended because nobody can pull it without already knowing the
# exact commit that produced it.
#
# This also doubles as the MSRV check for the whole project. docker/Dockerfile's
# builder stage is pinned to the workspace's declared rust-version (1.98) while a
# developer's local toolchain is invariably newer, so a build here is the only
# thing that reliably catches code reaching past the MSRV. That is why pull
# requests build the image even though they never publish it — amd64 only,
# though: see the `platforms` step below for why arm64 stays a main/tag-only
# check rather than a per-PR one.
#
# A `v*` tag no longer publishes straight to `:latest`/`:X.Y.Z` unattended: `build`
# pushes the real, fully-built multi-arch image to a provisional tag nobody would
# discover by browsing GHCR, and docker.yml's `publish` job — behind that
# file's `gate` (signed tag, tagged commit on `main`, green ci.yml) and
# `scan` jobs — retags exactly that
# digest onto the tags an operator would actually pull. Nothing rebuilds between
# the two; what gets promoted is the bytes that were already built and attested,
# not a second, unaudited build. The `main`-push sha tag skips this entirely — see the
# paragraph above for why that is safe to leave unattended.
#
# The tag is also the version the binary reports. Cargo.toml carries a fixed
# placeholder; the `version` step below strips the `v` from the tag (or stamps
# a dev build as `0.0.0-dev+g<sha7>`) and hands it to the Dockerfile as a build
# arg. There is nothing to bump before tagging.
#
# `workflow_dispatch` is this workflow's rehearsal: `build` pushes to the same
# provisional `pending-<sha>` tag on a manual dispatch as it does on a real `v*`
# push (see `PUSH_IMAGE` and the `dest` step below, each with a
# `workflow_dispatch` branch added), and gets a real
# provenance attestation against that tag too — so the whole build-push-attest
# path can be exercised any day, not only discovered broken the day a tag is
# actually pushed. docker.yml's `publish` job cannot be reached this way: it
# hard-requires `github.event_name == 'push'` in addition to the tag-ref
# check — without that, dispatching against an *existing* `v*` tag ref alone
# satisfies `startsWith(github.ref, 'refs/tags/v')`, so a manual dispatch
# aimed at a released tag could reach `publish` and retag `latest`
# unattended. The event check makes that impossible regardless of
# environment config.
#
# No separate "fake version" input: this workflow's tags are git-ref-derived
# and the fake provisional destination (`pending-<sha>`) needs no version to
# be meaningful - the sha it is keyed on is real either way. `needs.build.outputs.tags` (the
# human-facing `latest`/semver tags `meta` would compute) is simply never read
# on a dispatch, because `publish` never runs on one.
#
# Every build that pushes (a `main` push, a `v*` tag, a dispatch) also carries
# an SBOM and `mode=max` build provenance inside the image index, plus signed
# GitHub attestations for both (provenance, and one SPDX SBOM per
# architecture) pushed to GHCR next to the digest. Every build, pushed or
# not, is smoke-tested: `--version` and the image's own HEALTHCHECK
# (docker/smoke_test.sh). A PR's amd64 build is loaded into the runner's
# docker for that; a pushed build is pulled back by digest.
#
# Permissions: read-only by default; `build` takes `packages: write` to push
# and `id-token: write` + `attestations: write` to sign the attestations.

name: Build a Docker image

on:
  workflow_call:
    outputs:
      tags:
        description: The real tags this image should carry once promoted — see `build`'s own output below.
        value: ${{ jobs.build.outputs.tags }}
      digest-ref:
        description: The pushed image by digest (image@sha256:...), empty when nothing was pushed — see `build`'s own output below.
        value: ${{ jobs.build.outputs.digest-ref }}
    inputs:
      image:
        description: The image reference to build and publish, without a tag (e.g. ghcr.io/owner/repo).
        type: string
        required: true
      target:
        description: The docker/Dockerfile build target — runtime-sharerr or runtime-lighthouse.
        type: string
        required: true
      filters:
        description: dorny/paths-filter rules (YAML), passed through to prepare.yml.
        type: string
        required: true
      cache-scope:
        description: The type=gha buildx cache scope for this image (kept distinct per image so they don't evict each other).
        type: string
        required: true
      build-timeout:
        description: Minutes before the `build` job is killed.
        type: number
        default: 30
      extra-labels:
        description: >-
          Extra OCI metadata for docker/metadata-action, on top of its defaults,
          applied both as image labels and as manifest and index annotations.
          docker.yml gets org.opencontainers.image.source for free because its
          `image` is the repository itself; an image named for a crate instead
          (the lighthouse) has to state the link back to this repo explicitly.
        type: string
        default: ""

# No workflow-level `concurrency:` here, deliberately: that stays in
# docker.yml, which covers both calls to this workflow — a superseded PR
# push cancels both in-flight builds together,
# since docker.yml's `publish` job needs both to have succeeded anyway. A
# group declared here would apply per-call instead, which is finer-grained
# than docker.yml actually wants.
#
# Read-only by default; each job below elevates only the permission it needs,
# rather than every job inheriting `packages: write` whether it pushes or not.
# The calling job's own `permissions:` is the ceiling here — see each caller's
# `uses:` block, which has to grant every one of these up front.
permissions:
  contents: read

jobs:
  # Which runner to use, and whether anything this image cares about changed —
  # see prepare.yml. Tag pushes bypass the result entirely (`build`'s `if:`
  # below): a release must build regardless of what the diff says.
  #
  # Draft PRs skip here, which skips `build` with it (see docker.yml's
  # `pull_request:` trigger for why the skip is not on the caller).
  prepare:
    name: prepare
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      pull-requests: read
    uses: ./.github/workflows/prepare.yml
    with:
      filters: ${{ inputs.filters }}

  # See prepare.yml: the one place that decides whether a run gets the
  # self-hosted box, so a fork's pull_request build — which compiles the
  # fork's own Dockerfile and Rust source — can never read vars.RUNNER_LABEL
  # straight off this repo and land its own code there. This job never pushes
  # on a fork PR either way (see the login step's condition below), but it
  # still runs the compile, which is exactly the code a fork PR should not
  # get to run wherever RUNNER_LABEL points.
  build:
    name: build
    needs: prepare
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      needs.prepare.outputs.code == 'true'
    runs-on: ${{ needs.prepare.outputs.label }}
    timeout-minutes: ${{ inputs.build-timeout }}
    permissions:
      contents: read
      # Only actually exercised on a `v*` tag push — see the login step below —
      # but a job's permissions are fixed before any step's `if:` is evaluated,
      # so it has to be granted here regardless of which event triggered this run.
      packages: write
      id-token: write
      attestations: write
    outputs:
      # The tags this image should carry once promoted — computed here from
      # metadata-action so `publish` promotes exactly what this build decided,
      # rather than re-deriving the same ref/semver logic a second time.
      tags: ${{ steps.meta.outputs.tags }}
      # The digest this job pushed, pinned: what docker.yml's `scan` job
      # scans and `publish` promotes, so a second push to `pending-<sha>` in
      # between cannot swap the bytes.
      digest-ref: ${{ steps.digest.outputs.ref }}
    # Whether this run pushes: a `v*` tag, a push to `main`, or a dispatch
    # rehearsal. Every other event (a PR) builds only. Read by the login,
    # dest, build, smoke test and attestation steps below, so they cannot
    # disagree.
    env:
      PUSH_IMAGE: >-
        ${{ startsWith(github.ref, 'refs/tags/v') ||
            (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
            github.event_name == 'workflow_dispatch' }}
    steps:
      # Audit only: a self-hosted RUNNER_LABEL box just logs that the agent
      # is not installed there.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes back to GitHub; a lingering token in .git/config is
          # a credential with no job left to use it.
          persist-credentials: false

      # QEMU is needed for the arm64 leg, but only barely: the Dockerfile
      # cross-compiles the Rust build natively, so the only emulated work is the
      # runtime stage's apt-get and useradd. That is seconds, against the ~45
      # minutes an emulated `cargo build --release` would cost. Skipped
      # entirely on a PR, where `platforms` below never asks for arm64 at all —
      # a PR's job is proving amd64 still builds and still passes the MSRV
      # check; the cross-compile path is verified on every push to `main` and
      # every `v*` tag instead, so it cannot rot unnoticed for longer than one
      # merge.
      - if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      # Required for --platform builds and for the type=gha cache backend.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only when something is actually going to be pushed. A PR from a fork gets a
      # read-only GITHUB_TOKEN, so logging in would fail for exactly the
      # contributors least equipped to diagnose it — there is nothing to log in for
      # on a PR. `workflow_dispatch` now logs in too: see the header comment's
      # rehearsal paragraph.
      - if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tags this build *would* publish, computed either way: `publish`
      # reads this output regardless of whether this run pushes anything today.
      #
      # The same OCI metadata goes out twice: as `labels` on each
      # architecture's image config (what `docker inspect` shows), and as
      # `annotations` on the manifests and the index. GHCR's package page
      # reads a multi-arch image's description and source link off the
      # index's annotations, never a config label, so labels alone leave the
      # page blank. metadata-action builds the two lists from separate inputs,
      # which is why `extra-labels` is passed to both.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ inputs.image }}
          # `latest` comes only from the explicit `type=raw` rule below, never
          # from the action's `latest=auto`. For a prerelease tag
          # (v1.0.0-rc1) the semver rules already emit only the full version,
          # no `X.Y`, so a prerelease carries `X.Y.Z-rc1` and `sha-<7>` only.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # No `-` clause: a prerelease tag (v1.0.0-rc1) must never move
            # `latest` onto a release candidate.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha
          labels: ${{ inputs.extra-labels }}
          annotations: ${{ inputs.extra-labels }}

      # Where a pushing build lands (`tag`), and which of the two kinds of
      # push this is (`kind`); both empty when `PUSH_IMAGE` says a PR, which
      # pushes nothing and takes `meta`'s tags for the loaded image instead.
      #
      # `kind=pending`, a `v*` tag or a rehearsal dispatch: `pending-<sha>`, a
      # tag nobody would find by browsing GHCR's tag list, named after the
      # commit rather than a counter so two runs of the same push never race
      # each other for it. This is where a `v*` tag's real build actually
      # lands — `publish` only ever points the human-facing tags at it. It
      # also rebuilds the runtime base uncached (`no-cache-filters` below).
      #
      # `kind=sha`, the one other pushing event, a push to `main`: the
      # unattended publish path, straight to `sha-<7>` and nothing else — no
      # `latest`, no branch name — findable only by someone who already has
      # the commit sha that produced it. Matches `type=sha`'s own default
      # naming (`meta` above, and CLAUDE.md's Repository section) so there is
      # one sha-tag format to know, not two. The only kind that writes the
      # build cache (`cache-to` below).
      - id: dest
        env:
          IMAGE: ${{ inputs.image }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [ "$PUSH_IMAGE" = true ] || exit 0
          if [[ $REF == refs/tags/v* || $EVENT == workflow_dispatch ]]; then
            printf 'tag=%s:pending-%s\nkind=pending\n' "$IMAGE" "$SHA" >>"$GITHUB_OUTPUT"
          else
            printf 'tag=%s:sha-%s\nkind=sha\n' "$IMAGE" "${SHA:0:7}" >>"$GITHUB_OUTPUT"
          fi

      # The version the binary reports. A `v*` tag is the version, verbatim
      # minus the `v`; everything else is a dev build stamped with its commit.
      # Cargo.toml's own version is a placeholder (docs/RELEASING.md, "Cutting
      # a release"); the Dockerfile hands this to crates/sharerr/build.rs as a
      # build arg. This is also the only shape check a tag gets, and it runs
      # before the build, so a malformed tag fails here rather than after
      # `publish` has already moved `latest`.
      - id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*)
              if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
                echo "::error::tag $REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
                exit 1
              fi
              echo "version=${REF_NAME#v}" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=0.0.0-dev+g${SHA:0:7}" >>"$GITHUB_OUTPUT"
              ;;
          esac

      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ inputs.target }}
          build-args: SHARERR_VERSION=${{ steps.version.outputs.version }}
          # amd64 only on a PR; both architectures on a push to `main` and on
          # a `v*` tag, which is what actually needs to prove the arm64 cross
          # path (and what `publish` eventually promotes). See the QEMU step
          # above for the corresponding skip.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # A `v*` tag pushes to the provisional ref `dest` picked — the real
          # tags computed by `meta` reach GHCR only once `publish` passes its
          # gate. A `main` push ships straight to its own sha-only tag with
          # no gate — see `dest`'s comment for why. A manual
          # `workflow_dispatch` also pushes now, to the same provisional ref a
          # tag push would use — the rehearsal path; see the header comment.
          # Every other event (a PR) keeps pushing nothing at all: those
          # builds still exist solely to compile, which is what makes this
          # job double as the MSRV gate.
          push: ${{ env.PUSH_IMAGE == 'true' }}
          # A PR's single-platform build goes into the runner's docker instead,
          # for the smoke test below; a multi-platform build cannot be loaded.
          load: ${{ env.PUSH_IMAGE != 'true' }}
          # An SBOM (BuildKit's syft scan of the runtime stage) and full
          # build provenance, stored as attestation manifests in the pushed
          # index, so `docker buildx imagetools inspect` shows both and the
          # retag in docker.yml's `publish` carries them. Pushing builds only:
          # the docker exporter a PR's `load` uses cannot hold them.
          sbom: ${{ env.PUSH_IMAGE == 'true' }}
          provenance: ${{ env.PUSH_IMAGE == 'true' && 'mode=max' || 'false' }}
          tags: ${{ steps.dest.outputs.tag || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushing builds only, like `sbom`: a PR's single-platform `load`
          # has no index, and BuildKit refuses an `index:` annotation there
          # rather than dropping it. `publish`'s retag keeps them, since
          # `imagetools create` from one index source copies its bytes as-is.
          annotations: ${{ env.PUSH_IMAGE == 'true' && steps.meta.outputs.annotations || '' }}
          # `cache-from` reads on every event; `cache-to` writes only from a
          # push to `main`. A PR or a `v*` tag reads whatever `main` last
          # wrote (GitHub Actions cache entries are visible to every ref, not
          # just the one that wrote them — a tag build especially has no need
          # to write its own copy of a cache `main` just populated).
          #
          # `mode=max`, now that docker/Dockerfile cooks its dependency layer
          # with cargo-chef: exporting the builder stage is the entire point —
          # under `mode=min`, only the final image's layers would export, and
          # the cargo-chef cook layer that makes CI builds warm would never
          # reach the cache at all. `mode=min` was the right call for the
          # pre-chef Dockerfile (the old comment here explained why: `COPY . .`
          # sat before the build and every commit changed its digest, so the
          # only reusable layer was the runtime stage's emulated apt-get) — it
          # stops being right the moment the layer being exported is a
          # manifest-derived dependency build instead of the whole workspace.
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          # A release (or its rehearsal) rebuilds the runtime stages' base from
          # scratch: `runtime-base` runs `apt-get upgrade`, and a cached layer
          # would ship whatever packages were current when `main` last wrote
          # the cache, past the scan that is meant to see today's. The Rust
          # builder stages, where the cache saves the time, still read it.
          no-cache-filters: ${{ steps.dest.outputs.kind == 'pending' && 'runtime-base' || '' }}
          cache-to: >-
            ${{ steps.dest.outputs.kind == 'sha' &&
                format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}

      - id: digest
        if: env.PUSH_IMAGE == 'true'
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >>"$GITHUB_OUTPUT"

      # The image runs and goes healthy: see docker/smoke_test.sh. A pushed
      # build is pulled back by digest (the runner's own architecture out of
      # the index); a PR's build is the image `load` just put in docker.
      - name: Smoke test (--version and HEALTHCHECK)
        env:
          REF: ${{ env.PUSH_IMAGE == 'true' && steps.digest.outputs.ref || steps.push.outputs.imageid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: docker/smoke_test.sh "$REF" "$VERSION"

      # Signed proof that this exact digest was built by this workflow run, from
      # this commit — checkable later with `gh attestation verify <image> --repo
      # <owner>/<repo>` against whichever tag `publish` eventually points at it.
      # `push-to-registry` attaches it to the image in GHCR as an OCI referrer,
      # so it travels with the digest through the retag docker.yml's `publish`
      # job does rather than needing to be regenerated against the final
      # tags. Runs on every build that pushes: a `main` push's `sha-<7>` image
      # is attested the same as a release, and a rehearsal dispatch exercises
      # this step against the same provisional tag a real tag push would
      # attest, rather than discovering it broken on the day it matters.
      - if: env.PUSH_IMAGE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The SBOMs `sbom: true` stored in the index, read back out as SPDX
      # JSON, one per architecture: the package lists differ by arch. Read
      # from the registry rather than regenerated with a second scanner, so
      # the signed SBOM is the same document the index already carries.
      - id: sbom
        if: env.PUSH_IMAGE == 'true'
        env:
          REF: ${{ steps.digest.outputs.ref }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            out="$RUNNER_TEMP/sbom-$arch.spdx.json"
            docker buildx imagetools inspect "$REF" \
              --format "{{ json (index .SBOM \"linux/$arch\").SPDX }}" >"$out"
            # a missing platform renders `null`, not an error
            jq -e '.spdxVersion' "$out" >/dev/null || {
              echo "::error title=sbom::no linux/$arch SPDX SBOM in $REF"
              exit 1
            }
            echo "$arch=$out" >>"$GITHUB_OUTPUT"
          done

      # A signed SBOM attestation per architecture, on the index digest, so
      # `gh attestation verify --predicate-type https://spdx.dev/Document/v2.3`
      # covers what is in the image as well as who built it. actions/attest
      # directly: attest-build-provenance above is a wrapper over the same
      # action, and actions/attest-sbom is deprecated in its favour. The
      # header-size bump is the one the wrapper sets on its inner step.
      - if: env.PUSH_IMAGE == 'true'
        name: Attest the linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.amd64 }}
          push-to-registry: true

      - if: env.PUSH_IMAGE == 'true'
        name: Attest the linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.arm64 }}
          push-to-registry: true
