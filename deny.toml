# cargo-deny configuration. Run locally with:
#
#   cargo deny check advisories licenses bans sources
#
# CI runs the same command on every push and once a week — the weekly run is the
# point, since a new advisory against a dependency arrives without anyone touching
# this repository.

[graph]
# Only the platforms sharerr is actually built for. Without this, advisories and
# licence findings from Windows- and macOS-only dependencies are reported against a
# project that never compiles them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
# No blanket ignores. An advisory that cannot be acted on gets its id listed here
# with a comment saying why — never a silent global downgrade.
ignore = [
    # `custom_derive` is unmaintained. It is three levels down and not reachable
    # from anything sharerr calls:
    #
    #   custom_derive <- conv <- lava_torrent <- sharerr-torrent
    #
    # Unmaintained is not a vulnerability, and there is no fix to take: the only
    # route off it is replacing `lava_torrent`, which is itself in maintenance mode
    # and is already behind the `TorrentFactory` trait for exactly that reason. So
    # this is a known, bounded exposure rather than something to fix today.
    #
    # Revisit when the factory grows a second implementation.
    "RUSTSEC-2025-0058",

    # `paste` is unmaintained (the author archived the repository). It reaches
    # this workspace only as a proc-macro:
    #
    #   paste <- utoipa-axum <- sharerr, sharerr-lighthouse
    #
    # Two things bound the exposure. It is a *proc-macro*, so it runs at compile
    # time on this machine and contributes no code to the shipped binary — the
    # container carries nothing of it. And unmaintained is not a vulnerability:
    # the advisory itself records "No safe upgrade is available".
    #
    # There is also no upgrade to take. `utoipa-axum 0.2.0` is the newest
    # release, and dropping it would mean giving up generating the OpenAPI spec
    # from the handlers themselves — the property that stops a route being
    # documented into existence or quietly forgotten (see `sharerr::openapi`).
    #
    # Revisit when utoipa-axum publishes a release that drops `paste`, which the
    # weekly `cargo deny` run will keep asking about until it does.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Permissive licences only, matching the project's own MIT. A copyleft dependency
# is a decision to make deliberately, not to discover at release time.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# `warn`, not `deny`: duplicate versions are usually somebody else's transitive
# problem and blocking the build on one would mean pinning dependencies for
# reasons unrelated to sharerr. Worth seeing, not worth failing on.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
