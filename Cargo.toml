[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Above edition 2024's 1.85 floor for two reasons: `settings::strip_prefix` needs
# `str::split_at_checked` in a const context (1.86), and the reconciliation loop
# and title resolution use let-chains (1.88). Raised to 1.98 on 2026-08-24 to
# track current stable rather than because anything past 1.88 is in use yet.
#
# The Dockerfile pins this same toolchain, which makes `docker build` the de-facto
# MSRV check — a local toolchain is invariably newer and will not catch a breach.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ivylikethevine/sharerr-rs"

# One version pin per dependency, for the whole workspace.
#
# These used to live in each crate: `serde_json` was written out in seven
# manifests, `tracing` in six, `tokio` in five with five different feature sets. The
# drift that produced was already visible — `getrandom` was pinned to "0.4" in one
# crate and "0.4.3" in another — and sharerr-testkit carried a hand-written comment
# reminding the reader to keep its `sqlx` in step with sharerr-store's, which is
# exactly the job this table does automatically.
#
# Features stay per-crate, since they are genuinely per-crate: a crate writes
# `tokio = { workspace = true, features = [...] }` and cargo unions them. Only the
# version and `default-features` are settled here.
[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
askama = "0.16.0"
async-trait = "0.1.92"
# Transmission's RPC takes the .torrent as base64 in a JSON body, unlike
# qBittorrent's multipart upload.
base64 = "0.22.1"
axum = "0.8.9"
axum-extra = "0.12.6"
chacha20poly1305 = "0.11.0"
clap = "4.6.6"
# Gossip records are signed by the peer they describe; Ed25519 because the keys
# and signatures are small enough to travel in JSON and the verify cost is
# nothing next to the HTTP request carrying it. `rand_core` stays off — key
# material comes from the same `getrandom` path as every other secret.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc"] }
# Cross-process advisory `flock` on the vault's lock file. `std::fs::File::lock`
# does the same job but landed in Rust 1.89, one past this workspace's MSRV.
fd-lock = "4.0.4"
figment = "0.10.19"
# The facade over the futures-util that reqwest and axum already pull in;
# used for join_all over dynamically-sized sets of independent requests.
futures = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
lava_torrent = "0.11.1"
# `default-features = false` on purpose: it drops the default TLS backend in favour
# of rustls, so no build here needs OpenSSL on the host or in the image.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "http2", "charset"] }
rpassword = "7.5.4"
# rTorrent speaks XML-RPC and nothing else; this crate's `Reader` decodes the
# `<value>` tree a multicall response nests, hand-rolled rather than pulled from
# an XML-RPC crate because none on crates.io is both async-transport-agnostic
# and free of a copyleft or unreviewed licence — see `sharerr-rtorrent`.
quick-xml = "0.42.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
# Peer API keys are hashed with SHA-256, not Argon2 — they are 160 bits of CSPRNG
# output rather than a human password, and the lookup has to be an indexed
# equality on every Torznab request. See migrations/0003_peers.sql.
# Media probing, for the library sources with no *arr behind them to ask.
# Three crates because none covers the others' containers: `matroska` reads
# MKV/WebM EBML track headers, `mp4` reads ISO-BMFF boxes, `symphonia` reads
# the audio-only containers neither does — FLAC and MP3 natively, Opus via its
# `ogg` format reader (which recognises an Opus identification packet with no
# separate codec feature; nothing here ever needs to actually decode one).
# All three are metadata-only in how this project uses them — nothing decodes
# a frame, and nothing opens a file for writing, which is what keeps the probe
# compatible with never modifying the library. `default-features = false`
# drops every codec/format/tag reader none of the three formats above need
# (Vorbis and WAV decoding, ID3/APE tags, SIMD decode paths, ...).
matroska = "0.30"
mp4 = "0.14"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg"] }
sha2 = "0.10.9"
# `macros` is what provides `sqlx::migrate!`, which embeds migrations/ into the
# binary at compile time. Unlike `query!` it never reads DATABASE_URL, so builds
# still need no live database. One pin here also means one libsqlite3-sys.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "tls-none"] }
# CPU/memory/disk usage for the status page's stat tiles. `default-features =
# false` drops network/user/component support this project never reads.
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "system"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["serde", "formatting", "parsing"] }
tokio = "1.53.1"
toml_edit = "0.22.27"
# Dev-only, for `ServiceExt::oneshot`: it drives the assembled axum router in
#-process, so the handler tests exercise the real middleware stack — the auth
# guard and the cross-origin layer — rather than the handlers in isolation.
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# NFKD decomposition for synthesized release titles: pulls the base letter out
# of an accented character (`é` -> `e` + combining accent) before the ASCII
# filter runs, so e.g. `Amélie` transliterates to `Amelie` instead of `Am.lie`.
unicode-normalization = "0.1.25"
url = "2.5.8"
# The OpenAPI spec is generated from the handlers themselves rather than
# hand-written, so a route cannot be documented into existence or quietly
# forgotten. `utoipa-axum` is what makes the second half of that true: a
# machine-facing route is mounted *through* the spec, so the router and the
# document are the same declaration. See `sharerr::openapi`.
utoipa = { version = "5.5.0", features = ["axum_extras", "url", "preserve_order"] }
utoipa-axum = "0.2.0"
wiremock = "0.6.5"
zeroize = "1.9.0"

# The workspace's own crates, so a version bump is one edit rather than five.
sharerr-arr = { version = "0.1.0", path = "crates/sharerr-arr" }
sharerr-client = { version = "0.1.0", path = "crates/sharerr-client" }
sharerr-core = { version = "0.1.0", path = "crates/sharerr-core" }
sharerr-lighthouse = { version = "0.1.0", path = "crates/sharerr-lighthouse" }
sharerr-qbit = { version = "0.1.0", path = "crates/sharerr-qbit" }
sharerr-rtorrent = { version = "0.1.0", path = "crates/sharerr-rtorrent" }
sharerr-probe = { version = "0.1.0", path = "crates/sharerr-probe" }
sharerr-store = { version = "0.1.0", path = "crates/sharerr-store" }
sharerr-transmission = { version = "0.1.0", path = "crates/sharerr-transmission" }
sharerr-testkit = { version = "0.1.0", path = "crates/sharerr-testkit" }
sharerr-torrent = { version = "0.1.0", path = "crates/sharerr-torrent" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# The vault and qbit clients handle secrets; make accidental panics loud in review.
unwrap_used = "warn"
expect_used = "warn"

# Readability. This tree is written to be read — the comments carry the
# reasoning, and these keep the code around them consistent enough that the
# comments are the only thing a reader has to slow down for. Each has exactly
# one right answer, so none of them costs anything to keep green.
unreadable_literal = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
str_to_string = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
explicit_iter_loop = "warn"
format_push_string = "warn"

# Honest signatures. An `async fn` that never awaits and a `-> Result` that
# never errors both make a caller carry ceremony for a promise the function
# does not make -- and both hide a real one being added later.
unused_async = "warn"
unnecessary_wraps = "warn"

# A hand-written Debug that quietly drops a field makes a debugging session
# lie to you. Paired with `missing_debug_implementations` above, which only
# ensures a Debug exists at all.
missing_fields_in_debug = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
